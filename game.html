<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>깨우지 마 💍</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px 0}
#app{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:400px;width:100%;margin:0 auto;background:#fff;border-radius:20px;overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;align-items:center;padding:1.5rem 1rem;gap:1rem;min-height:500px;justify-content:center}
.screen.on{display:flex}
.btn{border:none;border-radius:12px;padding:13px 32px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:#E8703A}
.btn:active{transform:scale(0.97)}
.sub{font-size:13px;color:#666;text-align:center;line-height:1.9;max-width:300px}
#s-game{padding:0;gap:0;position:relative}
#gc{display:block;width:100%;touch-action:none;border-radius:16px 16px 0 0}
#panel{width:100%;background:linear-gradient(180deg,#2A1A08,#1E0E04);border:0.5px solid #3A2010;border-top:none;border-radius:0 0 16px 16px;padding:.6rem .6rem .8rem;display:flex;flex-direction:column;gap:5px}
#btn-row{display:flex;gap:0;width:100%}
.ab{flex:1;height:58px;border:none;border-radius:8px;font-size:22px;font-weight:900;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s;margin:0 3px;gap:1px;touch-action:manipulation}
.ab:first-child{margin-left:0}.ab:last-child{margin-right:0}
.ab:active,.ab.on{transform:scale(0.86);box-shadow:inset 0 3px 8px rgba(0,0,0,0.35)}
.ab-ico{font-size:22px;line-height:1}
.ab-lbl{font-size:10px;font-weight:700;opacity:0.9;line-height:1}
#noise-panel{width:100%;padding:4px 2px 0}
#noise-label{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#A08060;margin-bottom:3px;padding:0 2px}
#noise-label span:nth-child(2){font-weight:700;color:#C8A878;font-size:11px}
#noise-track{width:100%;height:8px;background:rgba(0,0,0,0.3);border-radius:4px;overflow:hidden}
#noise-fill{height:100%;width:0%;border-radius:4px;transition:width 0.1s,background 0.3s;background:#E8A040}
#ab0{background:#E8A040}
#ab1{background:#E07030}
#ab2{background:#C05820}
#ab3{background:#A04010}
.star-row{font-size:28px;letter-spacing:4px}
#rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
#s-start{background:linear-gradient(180deg,#1A0E04 0%,#2A1A08 100%)}
#s-over{background:linear-gradient(180deg,#2A1A08 0%,#1A0E04 100%)}
#s-over .rc{background:rgba(255,220,160,0.08);border:0.5px solid #5C3A1A;border-radius:12px;padding:10px;text-align:center}
#s-over .rv{font-size:20px;font-weight:600;color:#F0D8B0}
#s-over .rl{font-size:11px;color:#A08060}
#s-over #em{color:#F0C060}
#s-over .star-row{filter:drop-shadow(0 0 6px rgba(255,200,60,0.6))}
#s-over.gameover{background:linear-gradient(180deg,#1A0808 0%,#0E0404 100%)}
#s-over.gameover .rc{background:rgba(255,80,60,0.08);border-color:#5C2020}
#s-over.gameover .rv{color:#FFD0D0}
#s-over.gameover .rl{color:#A06060}
#s-over.gameover #em{color:#FFB0A0}
</style>
</head>
<body>
<div id="app">
<div id="s-start" class="screen on">
  <div style="text-align:center;margin-bottom:4px">
    <div style="font-size:32px">💍</div>
    <p style="font-size:22px;font-weight:800;color:#F0C060;letter-spacing:-0.5px">깨우지 마</p>
    <p style="font-size:12px;color:#A08060;margin-top:2px">쉿.. 사장님 낮잠 중. 조용히 작업 완료하고 칼퇴!</p>
  </div>
  <div style="background:linear-gradient(135deg,#2A1A08,#1A0E04);border-radius:14px;padding:12px 14px;width:100%;color:#F0D8B0;font-size:12px;line-height:1.8;border:1px solid #5C3A1A">
    <div style="font-weight:700;margin-bottom:6px;font-size:13px;color:#F0C060">📖 게임 방법</div>
    <div>아이콘이 판정선에 닿는 순간 버튼을 누르세요</div>
    <div>타이밍이 맞을수록 소음이 작아집니다</div>
    <div style="margin-top:4px;color:#C8A878">✨ 정확 타이밍 연속 5회 → 잠재우기 보너스!</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%">
    <div style="background:linear-gradient(135deg,#3A2010,#2A1408);border:1px solid #5C3A1A;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px">
      <div style="font-size:22px">🔨</div>
      <div><div style="font-size:12px;font-weight:700;color:#F0C060">망치질</div><div style="font-size:10px;color:#A08060">빠름 · 소음 보통</div></div>
    </div>
    <div style="background:linear-gradient(135deg,#3A2010,#2A1408);border:1px solid #5C3A1A;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px">
      <div style="font-size:22px">🪛</div>
      <div><div style="font-size:12px;font-weight:700;color:#F0C060">줄질</div><div style="font-size:10px;color:#A08060">보통 · 소음 작음</div></div>
    </div>
    <div style="background:linear-gradient(135deg,#3A2010,#2A1408);border:1px solid #5C3A1A;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px">
      <div style="font-size:22px">🔥</div>
      <div><div style="font-size:12px;font-weight:700;color:#F0C060">땜질</div><div style="font-size:10px;color:#A08060">느림 · 소음 작음</div></div>
    </div>
    <div style="background:linear-gradient(135deg,#3A2010,#2A1408);border:1px solid #5C3A1A;border-radius:10px;padding:10px;display:flex;align-items:center;gap:8px">
      <div style="font-size:22px">💎</div>
      <div><div style="font-size:12px;font-weight:700;color:#F0C060">연마</div><div style="font-size:10px;color:#A08060">매우 느림 · 거의 무소음</div></div>
    </div>
  </div>
  <button class="btn" ontouchstart="event.preventDefault();unlockAudio();startGame();" onclick="startGame()">작업 시작 🔨</button>
</div>

<div id="s-game" class="screen">
  <canvas id="gc"></canvas>
  <div id="exit-overlay" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:10;align-items:center;justify-content:center;border-radius:16px 16px 0 0">
    <div style="background:#2A1A08;border:1.5px solid #5C3A1A;border-radius:14px;padding:20px 24px;text-align:center;color:#F0D8B0">
      <div style="font-size:22px;margin-bottom:8px">🚪</div>
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">게임을 나가시겠어요?</div>
      <div style="font-size:11px;color:#A08060;margin-bottom:16px">진행 중인 작업이 사라집니다</div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button ontouchstart="event.preventDefault();doExit();" onclick="doExit()" style="border:none;background:#C05820;color:#fff;font-size:13px;font-weight:700;padding:8px 20px;border-radius:8px;cursor:pointer;touch-action:manipulation">나가기</button>
        <button ontouchstart="event.preventDefault();hideExitConfirm();" onclick="hideExitConfirm()" style="border:none;background:#3A2010;color:#F0D8B0;font-size:13px;font-weight:700;padding:8px 20px;border-radius:8px;cursor:pointer;border:1px solid #5C3A1A;touch-action:manipulation">계속하기</button>
      </div>
    </div>
  </div>
  <div id="panel">
    <div id="btn-row">
      <button class="ab" id="ab0" onmousedown="pd(0)" onmouseup="pu(0)" onmouseleave="pu(0)" ontouchstart="td(event,0)" ontouchend="tu(event,0)"><span class="ab-ico">🔨</span><span class="ab-lbl">망치질</span></button>
      <button class="ab" id="ab1" onmousedown="pd(1)" onmouseup="pu(1)" onmouseleave="pu(1)" ontouchstart="td(event,1)" ontouchend="tu(event,1)"><span class="ab-ico">🪛</span><span class="ab-lbl">줄질</span></button>
      <button class="ab" id="ab2" onmousedown="pd(2)" onmouseup="pu(2)" onmouseleave="pu(2)" ontouchstart="td(event,2)" ontouchend="tu(event,2)"><span class="ab-ico">🔥</span><span class="ab-lbl">땜질</span></button>
      <button class="ab" id="ab3" onmousedown="pd(3)" onmouseup="pu(3)" onmouseleave="pu(3)" ontouchstart="td(event,3)" ontouchend="tu(event,3)"><span class="ab-ico">💎</span><span class="ab-lbl">연마</span></button>
    </div>
    <div id="noise-panel">
      <div id="noise-label">
        <span style="font-size:10px;color:#888">🔇 현재 소음</span>
        <span id="noise-text">조용함</span>
        <button id="exit-btn" ontouchstart="event.preventDefault();showExitConfirm();" onclick="showExitConfirm()" style="border:none;background:rgba(100,60,20,0.25);color:#C8A878;font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;cursor:pointer;touch-action:manipulation">나가기 ✕</button>
      </div>
      <div id="noise-track"><div id="noise-fill"></div></div>
    </div>
  </div>
</div>

<div id="s-over" class="screen">
  <div id="over-emoji" style="font-size:52px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5))">😴</div>
  <div class="star-row" id="sr">⭐⭐⭐</div>
  <p id="em" style="font-size:14px;font-weight:700;text-align:center"></p>
  <div id="rg">
    <div class="rc"><div class="rv" id="r1">0</div><div class="rl">최대 콤보</div></div>
    <div class="rc"><div class="rv" id="r3">0번</div><div class="rl">정확 타이밍</div></div>
    <div class="rc"><div class="rv" id="r4">0번</div><div class="rl">미스</div></div>
    <div class="rc"><div class="rv" id="r5">0/4</div><div class="rl">작업 완료</div></div>
    <div class="rc"><div class="rv" id="r6">0%</div><div class="rl">정확도</div></div>
    <div class="rc"><div class="rv" id="r7">0개</div><div class="rl">총 처리</div></div>
  </div>
  <div style="display:flex;gap:10px;width:100%;justify-content:center">
    <button class="btn" style="background:#3A2010;border:1px solid #5C3A1A;flex:1" ontouchstart="event.preventDefault();show('s-start');" onclick="show('s-start')">처음으로</button>
    <button class="btn" style="flex:1" ontouchstart="event.preventDefault();unlockAudio();startGame();" onclick="startGame()">다시 하기</button>
  </div>
</div>
</div>

<script>
// ── roundRect 폴리필 (iOS Safari 구버전 대응) ──────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    const rad=Array.isArray(r)?r[0]:(typeof r==='number'?r:0);
    const R=Math.min(Math.abs(rad),Math.abs(w)/2,Math.abs(h)/2);
    this.moveTo(x+R,y);
    this.lineTo(x+w-R,y);this.arcTo(x+w,y,x+w,y+R,R);
    this.lineTo(x+w,y+h-R);this.arcTo(x+w,y+h,x+w-R,y+h,R);
    this.lineTo(x+R,y+h);this.arcTo(x,y+h,x,y+h-R,R);
    this.lineTo(x,y+R);this.arcTo(x,y,x+R,y,R);
    this.closePath();
    return this;
  };
}
// ── 효과음 시스템 (Web Audio API) ──────────────────────────
let AC=null;
function unlockAudio(){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    // iOS: 무음 버퍼 재생으로 강제 unlock
    const buf=AC.createBuffer(1,1,22050);
    const src=AC.createBufferSource();src.buffer=buf;
    src.connect(AC.destination);src.start(0);
  }catch(e){}
}
function getAC(){
  if(!AC)unlockAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
// ── 오디오 유틸 ────────────────────────────────────────────
function makeNoiseBuf(ac,dur,lpFreq,hpFreq){
  const len=Math.floor(ac.sampleRate*dur);
  const buf=ac.createBuffer(1,len,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;
  if(lpFreq){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lpFreq;src.connect(f);return[src,f];}
  if(hpFreq){const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hpFreq;src.connect(f);return[src,f];}
  return[src,src];
}
function playBuf(ac,src,last,gainNode){
  src.connect(gainNode);gainNode.connect(ac.destination);src.start();if(last)src.stop(ac.currentTime+last);
}
function tone(ac,freq,type,vol,dur,freqEnd,dest){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
  if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
  o.connect(g);g.connect(dest||ac.destination);
  o.start();o.stop(ac.currentTime+dur+0.01);
}

// ── 효과음 (쥬얼리 공방) ──────────────────────────────────
const SFX={
  perf(){try{const ac=getAC();
    // 딸깍 충격
    const[s1]=makeNoiseBuf(ac,0.03,5000,1500);const g1=ac.createGain();g1.gain.setValueAtTime(0.28,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.04);playBuf(ac,s1,0.04,g1);
    const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(1800,ac.currentTime);o.frequency.exponentialRampToValueAtTime(600,ac.currentTime+0.05);const g=ac.createGain();g.gain.setValueAtTime(0.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.06);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.07);
    // 금속 "챙" 고음
    const oc=ac.createOscillator();oc.type='sine';oc.frequency.setValueAtTime(4200,ac.currentTime);oc.frequency.exponentialRampToValueAtTime(2800,ac.currentTime+0.35);
    const gc=ac.createGain();gc.gain.setValueAtTime(0.18,ac.currentTime);gc.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.38);
    oc.connect(gc);gc.connect(ac.destination);oc.start();oc.stop(ac.currentTime+0.39);
    // 배음 (금속 질감)
    const oc2=ac.createOscillator();oc2.type='sine';oc2.frequency.setValueAtTime(8400,ac.currentTime);oc2.frequency.exponentialRampToValueAtTime(5600,ac.currentTime+0.18);
    const gc2=ac.createGain();gc2.gain.setValueAtTime(0.07,ac.currentTime);gc2.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.20);
    oc2.connect(gc2);gc2.connect(ac.destination);oc2.start();oc2.stop(ac.currentTime+0.21);
  }catch(e){}},
  good(){try{const ac=getAC();
    const[s1]=makeNoiseBuf(ac,0.08,2000);const g1=ac.createGain();g1.gain.setValueAtTime(0.22,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.08);playBuf(ac,s1,0.09,g1);
    const o=ac.createOscillator();o.type='triangle';o.frequency.setValueAtTime(220,ac.currentTime);o.frequency.exponentialRampToValueAtTime(80,ac.currentTime+0.07);const g=ac.createGain();g.gain.setValueAtTime(0.14,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.09);
  }catch(e){}},
  meh(){try{const ac=getAC();
    const[s1,f1]=makeNoiseBuf(ac,0.13,1200,200);const g1=ac.createGain();g1.gain.setValueAtTime(0.20,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.13);playBuf(ac,s1,0.14,g1);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(160,ac.currentTime);o.frequency.exponentialRampToValueAtTime(70,ac.currentTime+0.12);const g=ac.createGain();g.gain.setValueAtTime(0.09,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.13);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.14);
  }catch(e){}},
  bad(){try{const ac=getAC();
    const[s1,f1]=makeNoiseBuf(ac,0.16,3500,400);const g1=ac.createGain();g1.gain.setValueAtTime(0.24,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.16);playBuf(ac,s1,0.17,g1);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(90,ac.currentTime+0.14);const g=ac.createGain();g.gain.setValueAtTime(0.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.16);
  }catch(e){}},
  miss(){try{const ac=getAC();
    const[s1,f1]=makeNoiseBuf(ac,0.08,8000,2000);const g1=ac.createGain();g1.gain.setValueAtTime(0.30,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.08);playBuf(ac,s1,0.09,g1);
    setTimeout(()=>{try{const[s2,f2]=makeNoiseBuf(ac,0.06,7000,1800);const g2=ac.createGain();g2.gain.setValueAtTime(0.22,ac.currentTime);g2.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.06);playBuf(ac,s2,0.07,g2);}catch(e){}},70);
    setTimeout(()=>{try{const[s3,f3]=makeNoiseBuf(ac,0.12,6000,1500);const g3=ac.createGain();g3.gain.setValueAtTime(0.16,ac.currentTime);g3.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.12);playBuf(ac,s3,0.13,g3);}catch(e){}},140);
    const o=ac.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(80,ac.currentTime);o.frequency.linearRampToValueAtTime(120,ac.currentTime+0.2);const g=ac.createGain();g.gain.setValueAtTime(0.10,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.22);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.23);
  }catch(e){}},
  done(){try{const ac=getAC();
    const[s1]=makeNoiseBuf(ac,0.10,800);const g1=ac.createGain();g1.gain.setValueAtTime(0.26,ac.currentTime);g1.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.10);playBuf(ac,s1,0.11,g1);
    const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(250,ac.currentTime);o.frequency.exponentialRampToValueAtTime(80,ac.currentTime+0.09);const g=ac.createGain();g.gain.setValueAtTime(0.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.10);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.11);
    setTimeout(()=>{try{const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=1400;const g2=ac.createGain();g2.gain.setValueAtTime(0.08,ac.currentTime);g2.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.3);o2.connect(g2);g2.connect(ac.destination);o2.start();o2.stop(ac.currentTime+0.31);}catch(e){}},90);
  }catch(e){}},
  clear(){try{const ac=getAC();
    [0,130,260,400].forEach((t,i)=>{setTimeout(()=>{
      const[s]=makeNoiseBuf(ac,0.09,700);const gn=ac.createGain();gn.gain.setValueAtTime(0.22-i*0.02,ac.currentTime);gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.09);playBuf(ac,s,0.10,gn);
      const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(220-i*20,ac.currentTime);o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+0.08);const g=ac.createGain();g.gain.setValueAtTime(0.16,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.09);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.10);
    },t);});
    setTimeout(()=>{
      const[s]=makeNoiseBuf(ac,0.06,9000,3000);const gn=ac.createGain();gn.gain.setValueAtTime(0.18,ac.currentTime);gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.06);playBuf(ac,s,0.07,gn);

// ── BGM (쥬얼리 공방 앰비언트) ──────────────────────────────
const BGM={
  nodes:{},playing:false,danger:false,

  start(){
    if(this.playing)return;
    this.playing=true;this.danger=false;
    const ac=getAC();if(!ac)return;
    // 마스터
    const master=ac.createGain();master.gain.setValueAtTime(0.15,ac.currentTime);
    master.connect(ac.destination);
    this.nodes.master=master;
    // 공방 룸 리버브
    const rev=ac.createConvolver();
    const rlen=Math.floor(ac.sampleRate*1.2);
    const rbuf=ac.createBuffer(2,rlen,ac.sampleRate);
    for(let c=0;c<2;c++){const d=rbuf.getChannelData(c);for(let i=0;i<rlen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rlen,2.5)*0.6;}
    rev.buffer=rbuf;
    const revG=ac.createGain();revG.gain.value=0.30;
    rev.connect(revG);revG.connect(master);
    this.nodes.rev=rev;
    // 공방 앰비언트 드론 — 환풍기/작업실 저음
    const drone=ac.createOscillator();drone.type='sine';drone.frequency.value=55;
    const droneG=ac.createGain();droneG.gain.value=0.18;
    const droneLfo=ac.createOscillator();droneLfo.frequency.value=0.08;
    const droneLfoG=ac.createGain();droneLfoG.gain.value=0.06;
    droneLfo.connect(droneLfoG);droneLfoG.connect(droneG.gain);
    drone.connect(droneG);droneG.connect(rev);droneG.connect(master);
    drone.start();droneLfo.start();
    // 두 번째 드론 — 조화음
    const drone2=ac.createOscillator();drone2.type='triangle';drone2.frequency.value=82;
    const drone2G=ac.createGain();drone2G.gain.value=0.08;
    drone2.connect(drone2G);drone2G.connect(rev);
    drone2.start();
    this.nodes.drone=drone;this.nodes.droneG=droneG;
    this.nodes.droneLfo=droneLfo;this.nodes.drone2=drone2;
    // 루프 시작
    this._scheduleLoop(ac,master,rev);
  },

  _scheduleLoop(ac,master,rev){
    if(!this.playing)return;
    if(this.nodes.master!==master)return;
    const tempo=this.danger?0.28:0.48;
    const loopLen=8*tempo*0.5+0.1;
    try{
      let t=ac.currentTime+0.08;
    // 작업 리듬 — 망치질 패턴 (쿵-쿵-따 느낌)
    const pattern=this.danger?
      [0,1,2,3,4,5,6,7]:  // 위험: 빠른 8비트
      [0,2,3,4,6,7];       // 평상: 불규칙 공방 리듬
    pattern.forEach(beat=>{
      const bt=t+beat*tempo*0.5;
      const isAccent=(beat===0||beat===4);
      // 충격음 (노이즈 레이어)
      const blen=ac.sampleRate*(isAccent?0.10:0.06);
      const bbuf=ac.createBuffer(1,blen,ac.sampleRate);
      const bd=bbuf.getChannelData(0);for(let i=0;i<blen;i++)bd[i]=(Math.random()*2-1)*Math.pow(1-i/blen,1.5);
      const bsrc=ac.createBufferSource();bsrc.buffer=bbuf;
      const blp=ac.createBiquadFilter();blp.type='lowpass';blp.frequency.value=isAccent?500:1200;
      const bg=ac.createGain();bg.gain.setValueAtTime(isAccent?0.22:0.12,bt);bg.gain.exponentialRampToValueAtTime(0.0001,bt+(isAccent?0.10:0.06));
      bsrc.connect(blp);blp.connect(bg);bg.connect(rev);bg.connect(master);
      bsrc.start(bt);bsrc.stop(bt+(isAccent?0.11:0.07));
      // 금속 배음
      const mo=ac.createOscillator();mo.type='sine';
      mo.frequency.setValueAtTime(isAccent?100:200,bt);
      mo.frequency.exponentialRampToValueAtTime(isAccent?40:80,bt+(isAccent?0.08:0.05));
      const mg=ac.createGain();mg.gain.setValueAtTime(isAccent?0.16:0.08,bt);mg.gain.exponentialRampToValueAtTime(0.0001,bt+(isAccent?0.09:0.06));
      mo.connect(mg);mg.connect(master);mo.start(bt);mo.stop(bt+(isAccent?0.10:0.07));
    });
    const loopLen2=8*tempo*0.5+0.1;
    }catch(e){}
    this._loopTimer=setTimeout(()=>this._scheduleLoop(ac,master,rev),(loopLen*1000)-100);
  },

  setDanger(on){
    if(this.danger===on)return;
    this.danger=on;
    if(!this.nodes.master)return;
    const ac=getAC();if(!ac)return;
    if(this.nodes.drone){
      this.nodes.drone.frequency.linearRampToValueAtTime(on?65:55,ac.currentTime+0.6);
      this.nodes.droneG.gain.linearRampToValueAtTime(on?0.28:0.18,ac.currentTime+0.6);
    }
    this.nodes.master.gain.linearRampToValueAtTime(on?0.20:0.15,ac.currentTime+0.6);
  },

  stop(fade=true){
    if(!this.playing)return;
    this.playing=false;
    if(this._loopTimer)clearTimeout(this._loopTimer);
    const ac=getAC();if(!ac)return;
    if(this.nodes.master&&fade)
      this.nodes.master.gain.linearRampToValueAtTime(0,ac.currentTime+0.8);
    setTimeout(()=>{
      try{
        ['drone','droneLfo','drone2'].forEach(k=>{if(this.nodes[k])this.nodes[k].stop();});
      }catch(e){}
      this.nodes={};
    },900);
  }
};

function startGame(){
  // iOS AudioContext unlock — 반드시 유저 인터랙션 직후 호출
  unlockAudio();

  judges=[];fx=[];completeFx=[];clearAnim=0;lastDangerBeat=0;lastDoubleSpawn=0;
  shakeX=0;shakeY=0;shakeAmp=0;shakePhase=0;shakeFreq=0;endState='';
  wakeFlash=0;laneFlash=[-1,-1,-1,-1];blinkT=0;blinkOpen=1;judgeWobble=0;
  hitstop=0;zoomAmt=1;perfFlash=0;

function loop(ts){
  if(!lastT){lastT=ts;raf=requestAnimationFrame(loop);return;}
  // 게임 종료 시 루프 즉시 중단
  if(dead||cleared)return;
  const dt=Math.min(ts-lastT,50);lastT=ts;
  gameT+=dt;
  try{
    if(hitstop>0){
      hitstop=Math.max(0,hitstop-dt);
      zoomAmt+=(1-zoomAmt)*0.18;
      perfFlash=Math.max(0,perfFlash-0.06);
      draw();raf=requestAnimationFrame(loop);return;
    }
    zoomAmt+=(1-zoomAmt)*0.12;
    perfFlash=Math.max(0,perfFlash-0.04);
    update(dt);
    draw();
  }catch(e){
    console.error(e);
    cancelAnimationFrame(raf);
    return;
  }  raf=requestAnimationFrame(loop);
}

function update(dt){
  spawnT-=dt;
  if(spawnT<=0){
    const avail=[0,1,2,3].filter(i=>!done[i]);
    if(avail.length){
      const counts=[0,1,2,3].map(i=>notes.filter(n=>n.d===i&&!n.hit&&!n.miss).length);
      const minCount=Math.min(...avail.map(i=>counts[i]));
      const preferred=avail.filter(i=>counts[i]===minCount);
      // 느린 도구 가중치 높임 (속도 반비례)
      const weights=preferred.map(i=>1/TOOL[i].speed);
      const totalW=weights.reduce((a,b)=>a+b,0);
      let r=Math.random()*totalW,d=preferred[preferred.length-1];
      for(let i=0;i<preferred.length;i++){r-=weights[i];if(r<=0){d=preferred[i];break;}}
      notes.push({d,y:-50,hit:false,miss:false});
      // 동시 생성: 3초 쿨다운 + 초반엔 없음
      if(Math.random()<0.18&&avail.length>1&&gameT>8000&&gameT-lastDoubleSpawn>3000){
        const d2=avail.filter(i=>i!==d)[Math.floor(Math.random()*(avail.length-1))];
        notes.push({d:d2,y:-50,hit:false,miss:false});
        lastDoubleSpawn=gameT;
      }
    }
    spawnT=getSpawnInterval();
  }
  notes.forEach(n=>{
    n.y+=(NOTE_SPEED*(1+wake*0.35))*TOOL[n.d].speed*dt;
    if(!n.hit&&!n.miss&&n.y>JUDGE_Y+52){
      n.miss=true;n.fadeR=1.0;miss++;combo=0;
      addNoise(TOOL[n.d].noise.m,n.d);
      addJ('미스💥',LANE_X[n.d],JUDGE_Y-28,'#FF2020');
      SFX.miss();
      shakeAmp=10+wake*8;shakeFreq=18+Math.random()*6;shakePhase=0;
      // wake 급상승 애니 + 레인 빨간 번쩍
      wakeFlash=1.0;
      laneFlash[n.d]=1.0;
    }
    if(n.miss&&n.fadeR!==undefined)n.fadeR=Math.max(0,n.fadeR-0.055);
  });
  notes=notes.filter(n=>n.y<CH+60&&(!n.miss||(n.fadeR!==undefined&&n.fadeR>0)));

  // 진동: sine 감쇠 파형
  if(shakeAmp>0.2){
    shakePhase+=dt*0.001*shakeFreq*Math.PI*2;
    const decay=Math.exp(-shakePhase*0.18);
    shakeX=Math.sin(shakePhase)*shakeAmp*decay;
    shakeY=Math.sin(shakePhase*1.3+1)*shakeAmp*0.5*decay;
    shakeAmp*=Math.pow(0.88,dt/16);
    cv.style.transform=`translate(${shakeX.toFixed(1)}px,${shakeY.toFixed(1)}px)`;
  } else {
    shakeAmp=0;shakeX=0;shakeY=0;cv.style.transform='';
  }

  noise=Math.max(0,noise-0.000035*dt); // 더 천천히 감소
  wake=Math.min(1,wake+noise*0.00025*dt); // noise→wake 전환 느리게
  wake=Math.max(0,wake-0.00012*dt);       // wake 자연 감소 2배 빠르게
  if(wake>=0.98)gameOver();
  BGM.setDanger(wake>0.75);
  // 타이머 제거 - 4개 완료가 목표, 완료 시 tap()에서 stageClear 호출

  const st=getState();
  bP=(bP+lerp(0.004,0.0012,st==='deep'?1:0.3)*dt)%(Math.PI*2);

  // wake > 0.8: 코골이 끊김 (nostril 진폭 감소)
  const snoreAmt=wake>0.8?Math.max(0,(1-wake)/0.2):1;
  nostril=st==='deep'?Math.max(0,Math.sin(bP)*0.6*snoreAmt+0.15*snoreAmt):0;

  eyeOpen+=((st==='awake'?1:st==='angry'?0.5:st==='stir'?0.15:0)-eyeOpen)*0.06;

  // wake > 0.8: 눈 깜빡임
  if(wake>0.8&&!dead&&!cleared){
    blinkT-=dt;
    if(blinkT<=0){
      blinkOpen=blinkOpen>0.5?0:1;
      blinkT=blinkOpen>0.5?(1200+Math.random()*1800):(80+Math.random()*60);
    }
    // eyeOpen에 블링크 반영 (stir 이상일 때만)
    if(st==='stir'||st==='angry'){
      eyeOpen=Math.max(eyeOpen,blinkOpen<0.5?0:0.15);
    }
  } else { blinkOpen=1; }

  // wake > 0.8: 판정선 흔들림
  judgeWobble=wake>0.8?Math.sin(Date.now()*0.004)*(wake-0.8)*CW*0.018:0;

  judges=judges.filter(j=>j.a>0);judges.forEach(j=>{j.y-=0.4;j.a-=0.014;}); // 체류 시간 0.022→0.014
  fx=fx.filter(f=>f.a>0);fx.forEach(f=>{f.a-=0.06;f.r+=1.4;});
  // 완료 파티클
  completeFx=completeFx.filter(p=>p.a>0);
  completeFx.forEach(p=>{p.x+=p.vx*dt*0.06;p.y+=p.vy*dt*0.06;p.vy+=0.12;p.a-=0.012;});
  if(clearAnim>0)clearAnim=Math.max(0,clearAnim-dt);
  wakeFlash=Math.max(0,wakeFlash-0.04*dt/16);
  laneFlash=laneFlash.map(v=>Math.max(0,v-0.05*dt/16));
  tapFlash=tapFlash.map(v=>Math.max(0,v-0.07*dt/16));
  judgeRing=judgeRing.map(v=>v+(1-v)*0.14);
  metalFx=metalFx.filter(p=>p.a>0);
  metalFx.forEach(p=>{p.x+=p.vx*dt*0.06;p.y+=p.vy*dt*0.06;p.vy+=0.08;p.a-=0.035;p.r*=0.97;});
  // 위험 심장박동 효과음
  if(wake>0.88&&!dead&&!cleared){
    const beatInterval=600-Math.round(wake*300); // wake 높을수록 빠르게
    if(gameT-lastDangerBeat>beatInterval){lastDangerBeat=gameT;SFX.danger();}
  }
}

function getState(){
  if(endState==='clear')return'deep';   // 클리어: 편안히 깊은 잠
  if(endState==='over')return'awake';   // 게임오버: 완전히 깸
  if(wake<0.12)return'deep';if(wake<0.38)return'light';
  if(wake<0.60)return'stir';if(wake<0.82)return'angry';return'awake';
}

function tap(d){
  if(dead||cleared||done[d])return;
  let best=null,bestDist=999,bestSigned=0;
  notes.forEach(n=>{
    if(n.hit||n.miss||n.d!==d)return;
    const signed=n.y-JUDGE_Y;
    const dist=Math.abs(signed);
    if(dist<bestDist){bestDist=dist;bestSigned=signed;best=n;}
  });
  fx.push({x:LANE_X[d],y:JUDGE_Y,r:8,a:0.9,col:TOOL[d].col});
  // 버튼 피드백: 레인 밝아짐 + 판정 원 확대 + 캔버스 미세 흔들림
  tapFlash[d]=1.0;
  judgeRing[d]=1.28;
  if(shakeAmp<2)shakeAmp=2+Math.random()*1.5;shakeFreq=22+Math.random()*8;shakePhase=0;
  // 금속 파티클 (소량)
  for(let i=0;i<5;i++){
    const angle=-Math.PI/2+(Math.random()-0.5)*Math.PI*0.8;
    const spd=1.5+Math.random()*2.5;
    metalFx.push({x:LANE_X[d],y:JUDGE_Y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,a:0.8,r:1.5+Math.random()*2,col:TOOL[d].col});
  }
  const earlyLimit=55,lateLimit=90;
  const inWindow=best&&(bestSigned>=-earlyLimit&&bestSigned<=lateLimit);
  const hasNotes=notes.some(n=>!n.hit&&!n.miss&&n.d===d);
  if(!inWindow){if(hasNotes)SFX.empty();return;}
  best.hit=true;hitCount++;
  let gr,na,pa;
  if(bestDist<22){
    gr='정확! ✨';na=TOOL[d].noise.p;pa=18;
    perf++;SFX.perf();
    // 히트스탑 40ms + 줌 + 플래시
    hitstop=40;
    zoomAmt=1.032;
    perfFlash=1.0;
    combo++;maxCombo=Math.max(maxCombo,combo);
    if(combo%5===0){
      wake=Math.max(0,wake-0.08);
      // 화면 파란 섬광
      for(let i=0;i<6;i++){
        fx.push({x:CW/2,y:CH*0.28,r:6+Math.random()*8,a:0.9,col:'#88CCFF'});
      }
      // wake 게이지 위치에 파란 파동 강조
      fx.push({x:CW/2,y:CH*0.42,r:20,a:0.7,col:'#44AAFF'});
      fx.push({x:CW/2,y:CH*0.42,r:10,a:0.9,col:'#AADDFF'});
      addJ(`💤 푹 자고 있어!`,CW/2,CH*0.38,'#66CCFF');
    }
  } else {
    combo=0;
    if(bestDist<36)     {gr='좋아요 👍';na=TOOL[d].noise.g;pa=12;SFX.good();}
    else if(bestDist<58){gr='아슬아슬'; na=TOOL[d].noise.o;pa=6;SFX.meh();}
    else                {gr=bestSigned<0?'너무 빨라!':'늦었어';na=TOOL[d].noise.m*0.55;pa=2;SFX.bad();}
  }
  addNoise(na,d);
  prog[d]=Math.min(TOOL[d].need,prog[d]+pa);
  if(prog[d]>=TOOL[d].need&&!done[d]){
    done[d]=true;
    // 완료 순간 해당 레인 남은 노트 즉시 제거
    notes=notes.filter(n=>n.d!==d||n.hit);
    // 완료된 버튼: innerHTML 변경 없이 CSS만으로 처리
    const btn=document.getElementById('ab'+d);
    btn.style.opacity='0.45';
    btn.style.filter='saturate(0) brightness(0.6)';
    btn.style.pointerEvents='none';
    for(let i=0;i<22;i++){
      const angle=Math.random()*Math.PI*2,spd=2+Math.random()*4;
      completeFx.push({x:LANE_X[d],y:JUDGE_Y,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-3,a:1,col:TOOL[d].col,r:3+Math.random()*4});
    }
    if(done.every(Boolean)){
      clearAnim=1800;SFX.clear();setTimeout(()=>{try{stageClear();}catch(e){}},1200);
    } else {
      addJ('완료! ✅',LANE_X[d],JUDGE_Y-55,'#E8703A');
      SFX.done();
    }
  } else {
    addJ(gr,LANE_X[d],JUDGE_Y-38,bestDist<22?'#F0C040':'#DDD');
  }
  if(bestDist<22)fx.push({x:LANE_X[d],y:JUDGE_Y,r:4,a:1,col:'#FFD060'});
}

function showExitConfirm(){
  if(dead||cleared)return;
  const ov=document.getElementById('exit-overlay');
  ov.style.display='flex';
}
function hideExitConfirm(){
  document.getElementById('exit-overlay').style.display='none';
}
function doExit(){
  hideExitConfirm();
  dead=true;cancelAnimationFrame(raf);
  BGM.stop(false);
  setTimeout(()=>show('s-start'),50);
}
function loadBest(){
  try{
    const s=localStorage.getItem('jwl_best');
    return s?JSON.parse(s):{};
  }catch(e){return{};}
}
function saveBest(combo,perfPct,isCleared){
  try{
    const b=loadBest();
    const updated={
      combo:Math.max(b.combo||0,combo),
      perfPct:Math.max(b.perfPct||0,perfPct),
      clears:(b.clears||0)+(isCleared?1:0)
    };
    try{localStorage.setItem('jwl_best',JSON.stringify(updated));}catch(e){}
    return updated;
  }catch(e){return{combo:combo,perfPct:perfPct,clears:0};}
}
function addNoise(a,d){
  noise=Math.min(1,noise+a);
}
function addJ(t,x,y,col){judges.push({t,x,y,a:1,col});}

function gameOver(){
  if(dead||cleared)return;dead=true;endState='over';wakeAtEnd=wake;cancelAnimationFrame(raf);
  BGM.stop();SFX.over();
  let alpha=0;
  const flash=setInterval(()=>{
    try{
      alpha=Math.min(0.85,alpha+0.07);
      if(ctx&&CW&&CH){ctx.fillStyle=`rgba(180,0,0,${alpha})`;ctx.fillRect(0,0,CW,CH);}
      if(alpha>=0.85)clearInterval(flash);
    }catch(e){clearInterval(flash);}
  },30);
  setTimeout(()=>{try{finish();}catch(e){}},1100);
}
function stageClear(){
  if(dead||cleared)return;cleared=true;endState='clear';wakeAtEnd=wake;cancelAnimationFrame(raf);
  BGM.stop();
  setTimeout(()=>{try{finish();}catch(e){}},900);
}
function finish(){
  const n=done.filter(Boolean).length;
  const perfPct=hitCount>0?Math.round(perf/hitCount*100):0;
  const isOver=dead&&!cleared;
  // 별 기준: 게임오버=0개, 4개완료+wake+정확도 반영
  let st;
  if(isOver) st=0;
  else if(n===4){
    if(wakeAtEnd<0.35&&perfPct>=60)      st=3;
    else if(wakeAtEnd<0.65&&perfPct>=35) st=2;
    else                                  st=1;
  } else {
    st=n>=3?2:n>=1?1:0;
  }
  const best=saveBest(maxCombo,perfPct,n===4&&st===3);
  const overEl=document.getElementById('s-over');
  overEl.classList.toggle('gameover',isOver);
  document.getElementById('over-emoji').textContent=isOver?'😤':'😴';
  document.getElementById('sr').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  document.getElementById('r1').textContent=maxCombo+(maxCombo>=(best.combo||0)&&maxCombo>0?' 🏆':'');
  document.getElementById('r3').textContent=perf+'번';
  document.getElementById('r4').textContent=miss+'번';
  document.getElementById('r5').textContent=n+'/4';
  document.getElementById('r6').textContent=perfPct+'%'+(perfPct>=(best.perfPct||0)&&perfPct>0?' 🏆':'');
  document.getElementById('r7').textContent=hitCount+'개';
  // 최고 기록 표시
  const bestLine=`최고 콤보 ${best.combo||0} · 정확도 ${best.perfPct||0}% · 클리어 ${best.clears||0}회`;
  document.getElementById('em').textContent=isOver
    ?'너무 시끄러웠어요! 다음엔 더 조용히 👂'
    :n===4?'사장님 안 깨우고 작업완료! 퇴근이당! 🎉':n>=3?'아슬아슬 거의 다 했는데...':`${n}개 완료. 조금 더 집중해봐요!`;
  // 별 조건 & 다음 목표 힌트
  let hintEl=document.getElementById('star-hint');
  if(!hintEl){
    hintEl=document.createElement('div');
    hintEl.id='star-hint';
    hintEl.style.cssText='width:100%;border-radius:10px;padding:8px 12px;font-size:11px;line-height:1.8;text-align:center';
    document.getElementById('sr').after(hintEl);
  }
  const nextGoal=st<3?(
    isOver?'타이밍을 정확히 맞출수록 소음이 줄어요. 조용히 해야 칼퇴 가능! 🤫':
    st===0?'⭐ 받으려면: 작업 1개 이상 완료':
    st===1?'⭐⭐ 받으려면: 작업 3개 이상 완료 또는 소음·정확도 개선':
    '⭐⭐⭐ 받으려면: 4개 완료 + 소음 적게 + 정확도 60% 이상!'
  ):'';
  hintEl.style.background=isOver?'rgba(255,80,60,0.08)':'rgba(255,200,80,0.08)';
  hintEl.style.border=isOver?'0.5px solid rgba(255,80,60,0.2)':'0.5px solid rgba(255,200,80,0.2)';
  hintEl.style.color=isOver?'#FF9090':'#C8A060';
  hintEl.innerHTML=st===3
    ?`<span style="color:#F0C060">⭐⭐⭐ 정확한 칼퇴! · 정확도 ${perfPct}%</span>`
    :`${nextGoal}<br><span style="color:#A08060">정확도 ${perfPct}% · 목표: 80% 이상</span>`;
  // 최고 기록 별도 표시
  let bestEl=document.getElementById('best-record');
  if(!bestEl){
    bestEl=document.createElement('p');
    bestEl.id='best-record';
    bestEl.style.cssText='font-size:11px;color:#A08060;text-align:center;margin-top:-4px';
    document.getElementById('rg').after(bestEl);
  }
  bestEl.textContent=`🏆 최고기록: ${bestLine}`;
  setTimeout(()=>{try{show('s-over');}catch(e){}},700);
}

function draw(){
  if(!CW||!CH)return;
  ctx.clearRect(0,0,CW,CH);ctx.globalAlpha=1;
  // 화면 확대 (정확 타이밍 히트 시)
  if(zoomAmt>1.001){
    ctx.save();
    ctx.translate(CW/2,CH/2);
    ctx.scale(zoomAmt,zoomAmt);
    ctx.translate(-CW/2,-CH/2);
  }
  drawBg();drawTaskBars();drawChar();
  drawLanes();drawNotes();drawJudgeLine();
  drawFx();drawCompleteFx();drawMetalFx();drawJudges();drawHUD();drawOverlay();
  if(clearAnim>0)drawClearAnim();
  // 정확 타이밍 플래시
  if(perfFlash>0){
    ctx.globalAlpha=perfFlash*0.38;
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(0,0,CW,CH);
    ctx.globalAlpha=1;
  }
  if(zoomAmt>1.001)ctx.restore();
  updateNoiseDom();
}
function drawBg(){
  // 위쪽: 따뜻한 공방 벽 (나무 패널)
  const wallG=ctx.createLinearGradient(0,0,0,CH*0.42);
  wallG.addColorStop(0,'#2A1A08');wallG.addColorStop(1,'#1A0E04');
  ctx.fillStyle=wallG;ctx.fillRect(0,0,CW,CH*0.42);

  // 태스크바 뒤 완전 불투명 검정 띠 (겹침 방지)
  ctx.fillStyle='#111008';ctx.fillRect(0,0,CW,36);

  // 벽 나무 패널 줄무늬 (태스크바 아래부터만)
  ctx.strokeStyle='rgba(60,30,8,0.5)';ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const px=CW*0.08+i*(CW*0.17);
    ctx.beginPath();ctx.moveTo(px,40);ctx.lineTo(px,CH*0.42);ctx.stroke();
  }

  // 작업대 상판
  const deskY=CH*0.42;
  ctx.fillStyle='#4A2E0E';ctx.fillRect(0,deskY,CW,14);
  ctx.fillStyle='#5C3A1A';ctx.fillRect(0,deskY,CW,6);
  ctx.fillStyle='rgba(255,200,100,0.06)';ctx.fillRect(0,deskY,CW,3);

  // 작업대 표면 (레인 영역)
  const tableG=ctx.createLinearGradient(0,deskY+14,0,CH);
  tableG.addColorStop(0,'#3A2010');tableG.addColorStop(1,'#1E0E04');
  ctx.fillStyle=tableG;ctx.fillRect(0,deskY+14,CW,CH);

  // 작업대 나뭇결
  ctx.strokeStyle='rgba(80,45,15,0.3)';ctx.lineWidth=1;
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.moveTo(0,deskY+18+i*12);ctx.lineTo(CW,deskY+22+i*12);ctx.stroke();
  }
}

function drawTaskBars(){
  const barH=28,topY=4;
  LANE_X.forEach((lx,i)=>{
    const bx=lx-LW/2,bw=LW,col=TOOL[i].col;
    const pct=done[i]?1:prog[i]/TOOL[i].need;

    // 배경
    ctx.fillStyle='rgba(0,0,0,0.38)';
    ctx.beginPath();ctx.roundRect(bx+2,topY,bw-4,barH,6);ctx.fill();

    // 진행 채움 - 전체 바를 아래→위로 채움
    if(pct>0.01){
      const fillH=(barH-2)*pct;
      const fillY=topY+1+(barH-2)-fillH;
      ctx.save();
      ctx.beginPath();ctx.roundRect(bx+2,topY,bw-4,barH,6);ctx.clip();
      const fg=ctx.createLinearGradient(0,fillY+fillH,0,fillY);
      if(done[i]){
        fg.addColorStop(0,'#0E7A55');fg.addColorStop(1,'#1D9E75');
      } else {
        fg.addColorStop(0,col);fg.addColorStop(1,lighten(col,1.3));
      }
      ctx.fillStyle=fg;ctx.globalAlpha=done[i]?0.9:0.65;
      ctx.fillRect(bx+2,fillY,bw-4,fillH);
      ctx.restore();ctx.globalAlpha=1;
    }

    // 아이콘
    ctx.font=`${barH*0.72}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(TOOL[i].ico,lx,topY+barH/2-1);

    // 완료 체크
    if(done[i]){
      ctx.fillStyle='rgba(255,255,255,0.92)';
      ctx.font=`bold ${barH*0.46}px sans-serif`;
      ctx.fillText('✓',lx+bw*0.22,topY+barH/2+4);
    }
  });
}

  ctx.beginPath();ctx.ellipse(hxw-R*0.87,hyw+R*0.11,R*0.13,R*0.25,-0.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(hxw+R*0.87,hyw+R*0.11,R*0.13,R*0.25,0.2,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#EEA468';ctx.beginPath();ctx.moveTo(ex-eW,ey);ctx.quadraticCurveTo(ex,ey-oh,ex+eW,ey);ctx.lineTo(ex+eW,ey-eH*2.8);ctx.lineTo(ex-eW,ey-eH*2.8);ctx.closePath();ctx.fill();

  // 배경 트랙
  ctx.fillStyle='rgba(0,0,0,0.18)';ctx.beginPath();ctx.roundRect(gx-gw/2,gy,gw,gh,gh/2);ctx.fill();
  // 채움 (초록→노랑→빨강)
  if(wake>0.005){
    const wg=ctx.createLinearGradient(gx-gw/2,0,gx+gw/2,0);
    wg.addColorStop(0,'#4DC87A');wg.addColorStop(0.5,'#F0C040');wg.addColorStop(1,'#E03020');
    ctx.fillStyle=wg;
    ctx.save();ctx.beginPath();ctx.roundRect(gx-gw/2,gy,gw,gh,gh/2);ctx.clip();
    ctx.fillRect(gx-gw/2,gy,gw*wake,gh);ctx.restore();
  }
  // wake 급상승 애니 — 게이지 위 빨간 펄스
  if(wakeFlash>0){
    ctx.save();ctx.globalAlpha=wakeFlash*0.85;
    ctx.fillStyle='#FF3020';
    ctx.beginPath();ctx.roundRect(gx-gw/2,gy-2,gw*Math.min(1,wake+wakeFlash*0.15),gh+4,gh/2);ctx.fill();
    // 게이지 테두리 빨간 글로우
    ctx.strokeStyle=`rgba(255,60,20,${wakeFlash*0.9})`;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.roundRect(gx-gw/2,gy,gw,gh,gh/2);ctx.stroke();
    ctx.restore();ctx.globalAlpha=1;
  }
  // 테두리
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(gx-gw/2,gy,gw,gh,gh/2);ctx.stroke();
  // 레이블
  ctx.fillStyle=wake<0.45?'rgba(40,80,40,0.7)':wake<0.75?'rgba(120,80,0,0.8)':'rgba(160,20,10,0.9)';
  ctx.font=`bold ${CW*0.026}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(stateLabels[stateIdx],gx,gy+gh+3);
}

function drawLanes(){
  [0,1,2,3].forEach(i=>{
    const lx=LANE_X[i];
    if(done[i]){
      // 완료 레인: 초록 채움 + 은은한 황금빛 shimmer
      ctx.fillStyle='rgba(29,180,110,0.14)';
      ctx.fillRect(lx-LW/2,CH*0.42,LW,CH*0.58);
      const shimmer=Math.abs(Math.sin(Date.now()*0.002+i))*0.08+0.04;
      ctx.fillStyle=`rgba(255,215,80,${shimmer})`;
      ctx.fillRect(lx-LW/2,CH*0.42,LW,CH*0.58);
      ctx.strokeStyle='rgba(29,180,110,0.30)';ctx.lineWidth=1.5;
      ctx.strokeRect(lx-LW/2,CH*0.42,LW,CH*0.58);
    } else {
      ctx.fillStyle='rgba(255,255,255,0.035)';
      ctx.fillRect(lx-LW/2,CH*0.42,LW,CH*0.58);
      ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
      if(i<3){ctx.beginPath();ctx.moveTo(lx+LW/2,CH*0.42);ctx.lineTo(lx+LW/2,CH);ctx.stroke();}
    }
    // 버튼 탭 시 레인 순간 밝아짐
    if(tapFlash[i]>0){
      ctx.save();ctx.globalAlpha=tapFlash[i]*0.28;
      ctx.fillStyle='#FFFFFF';
      ctx.fillRect(lx-LW/2,CH*0.42,LW,CH*0.58);
      ctx.restore();ctx.globalAlpha=1;
    }
    // 미스 레인 빨간 번쩍
    if(laneFlash[i]>0){
      ctx.save();
      ctx.globalAlpha=laneFlash[i]*0.55;
      ctx.fillStyle='#FF2020';
      ctx.fillRect(lx-LW/2,CH*0.42,LW,CH*0.58);
      ctx.globalAlpha=laneFlash[i]*0.9;
      ctx.strokeStyle='#FF4040';ctx.lineWidth=3;
      ctx.strokeRect(lx-LW/2+1,CH*0.42,LW-2,CH*0.58);
      ctx.restore();ctx.globalAlpha=1;
    }
  });
}

function drawNotes(){
  notes.forEach(n=>{
    if(n.hit)return;
    if(n.miss&&n.fadeR!==undefined){
      ctx.save();ctx.globalAlpha=n.fadeR;
      drawArrow(LANE_X[n.d],n.y,n.d,'#FF2020');
      ctx.restore();ctx.globalAlpha=1;
      return;
    }
    if(!n.miss)drawArrow(LANE_X[n.d],n.y,n.d,TOOL[n.d].col);
  });
}

function drawArrow(x,y,dir,col){
  ctx.save();ctx.translate(x,y);
  const s=LW*0.44;
  const isFast=TOOL[dir]&&TOOL[dir].speed>=1.1&&col!=='#FF2020';
  if(isFast){
    const pulse=Math.abs(Math.sin(Date.now()*0.012))*0.5+0.5;
    ctx.strokeStyle=`rgba(255,80,30,${pulse*0.75})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(0,0,s+5,0,Math.PI*2);ctx.stroke();
  }
  ctx.shadowColor=col;ctx.shadowBlur=14;
  const g=ctx.createRadialGradient(0,0,s*0.1,0,0,s*1.1);
  g.addColorStop(0,lighten(col,1.5));g.addColorStop(0.6,col);g.addColorStop(1,col+'88');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.72)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.stroke();
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=4;
  const ico=['🔨','🪛','🔥','💎'][dir];
  ctx.font=`${s*1.1}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(ico,0,1);
  ctx.shadowBlur=0;
  ctx.restore();ctx.globalAlpha=1;
}

function drawJudgeLine(){
  const jy=JUDGE_Y+judgeWobble;
  // 판정 범위 띠
  [0,1,2,3].forEach(i=>{
    if(done[i])return;
    const lx=LANE_X[i];
    ctx.save();ctx.globalAlpha=0.09;
    ctx.fillStyle='#FFFFFF';
    ctx.fillRect(lx-LW/2,jy-22,LW,44);
    ctx.restore();
  });
  [0,1,2,3].forEach(i=>{
    const lx=LANE_X[i],s=LW*0.38;
    if(done[i]){
      ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#1D9E75';ctx.font=`bold ${s*1.1}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',lx,jy);ctx.restore();ctx.globalAlpha=1;return;
    }
    const ico=['🔨','🪛','🔥','💎'][i];
    const ring=judgeRing[i]||1;
    ctx.save();ctx.globalAlpha=0.28;
    ctx.strokeStyle=TOOL[i].col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(lx,jy,s*ring,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=0.18;
    ctx.font=`${s*1.05}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ico,lx,jy+1);
    ctx.restore();ctx.globalAlpha=1;
  });
}

function drawFx(){
  fx.forEach(f=>{
    ctx.save();ctx.globalAlpha=Math.max(0,f.a);
    const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0,f.col+'CC');g.addColorStop(1,f.col+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  });
}
function drawJudges(){
  judges.forEach(j=>{
    ctx.save();ctx.globalAlpha=Math.max(0,j.a);
    ctx.fillStyle=j.col;ctx.font=`bold ${CW*0.034}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(j.t,j.x,j.y);ctx.restore();ctx.globalAlpha=1;
  });
}

function drawHUD(){
  if(combo>0&&clearAnim===0){
    const scale=1+Math.min(combo*0.04,0.4);
    ctx.save();
    ctx.fillStyle=combo>=5?'rgba(100,200,255,0.95)':'rgba(255,220,110,0.92)';
    ctx.font=`bold ${CW*0.048*scale}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(`✨ ${combo} COMBO`,CW/2,CH*0.415);
    if(combo>=4){
      ctx.fillStyle='rgba(150,230,255,0.75)';
      ctx.font=`${CW*0.024}px sans-serif`;
      const left=5-combo%5;
      ctx.fillText(left===1?`💤 다음 정확 → 잠재우기!`:`정확 ${left}번 더 → 잠재우기 💤`,CW/2,CH*0.415+CW*0.052*scale+4);
    }
    ctx.restore();
  }
}

function updateNoiseDom(){
  const fill=document.getElementById('noise-fill');
  const txt=document.getElementById('noise-text');
  if(!fill||!txt)return;
  const pct=Math.round(noise*100);
  fill.style.width=pct+'%';
  fill.style.background=noise<0.32?'#E8A040':noise<0.6?'#E07020':'#C03020';
  txt.textContent=noise<0.08?'조용함':noise<0.35?'소음 있음':noise<0.65?'⚠️ 위험!':'🚨 매우 위험!';
  txt.style.color=noise<0.08?'#A08060':noise<0.35?'#C8A060':noise<0.65?'#E07020':'#E03020';
}

function drawMetalFx(){
  metalFx.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.a);
    // 금속 파티클 — 작은 선분으로 표현
    ctx.strokeStyle=p.col;ctx.lineWidth=p.r;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2,p.y-p.vy*2);ctx.stroke();
    // 밝은 코어
    ctx.fillStyle='rgba(255,240,200,0.9)';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawCompleteFx(){
  completeFx.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.a);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

function drawClearAnim(){
  const t=clearAnim/1800;
  const pulse=Math.sin(Date.now()*0.01)*0.3+0.7;
  // 황금빛 방사 글로우
  ctx.save();ctx.globalAlpha=t*0.35*pulse;
  const g=ctx.createRadialGradient(CW/2,CH*0.3,0,CW/2,CH*0.3,CW*0.7);
  g.addColorStop(0,'rgba(255,230,80,0.9)');g.addColorStop(1,'rgba(255,150,20,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  ctx.restore();
  // 텍스트
  ctx.save();ctx.globalAlpha=Math.min(1,t*2)*pulse;
  ctx.font=`bold ${CW*0.075}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#FFD060';
  ctx.shadowColor='rgba(255,180,0,0.8)';ctx.shadowBlur=20;
  ctx.fillText('✨ 퇴근이다! ✨',CW/2,CH*0.48);
  ctx.shadowBlur=0;
  ctx.restore();
}

function drawOverlay(){
  ctx.globalAlpha=1;
  if(wake>0.35){
    const s=(wake-0.35)/0.65;
    const pulse=Math.sin(Date.now()*0.013)*0.28+0.72;
    const g=ctx.createRadialGradient(CW/2,CH*0.22,CH*0.04,CW/2,CH*0.22,CH*0.5);
    g.addColorStop(0,'rgba(150,25,5,0)');
    g.addColorStop(1,`rgba(150,25,5,${s*pulse*0.5})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  }
  // wake > 0.8: vignette 흔들림
  if(wake>0.8){
    const intensity=(wake-0.8)/0.2;
    const t=Date.now();
    const cx=CW/2+Math.sin(t*0.017)*intensity*CW*0.04;
    const cy=CH/2+Math.cos(t*0.011+1.2)*intensity*CH*0.03;
    const vg=ctx.createRadialGradient(cx,cy,CH*0.15,cx,cy,CH*0.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,`rgba(0,0,0,${intensity*0.38})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  }
  if(wake>0.75){
    const danger=(wake-0.75)/0.25;
    const pulse=Math.abs(Math.sin(Date.now()*0.025));
    ctx.strokeStyle=`rgba(220,20,20,${danger*pulse*0.95})`;
    ctx.lineWidth=10;ctx.strokeRect(0,0,CW,CH);
    ctx.fillStyle=`rgba(255,60,30,${danger*pulse*0.98})`;
    ctx.font=`bold ${CW*0.044}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText('⚠️ 곧 깨어나요!',CW/2,CH*0.47);
  }
}

function lighten(hex,t){
  const r=Math.min(255,Math.round(parseInt(hex.slice(1,3),16)*t));
  const g=Math.min(255,Math.round(parseInt(hex.slice(3,5),16)*t));
  const b=Math.min(255,Math.round(parseInt(hex.slice(5,7),16)*t));
  return `rgb(${r},${g},${b})`;
}
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}

// 탭 비활성화 시 타이밍 드리프트 방지
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    // 탭 숨겨짐 — lastT 무효화
    lastT=0;
  } else {
    // 탭 복귀 — lastT 리셋해서 dt 튐 방지
    lastT=0;
  }
});
// 모바일/브라우저 정책 대응: 첫 터치/클릭 시 AudioContext 활성화
document.getElementById('app').addEventListener('pointerdown',()=>{
  if(AC&&AC.state==='suspended')AC.resume();
},{once:false,passive:true});
window.addEventListener('resize',()=>{
  if(!dead&&!cleared&&document.getElementById('s-game').classList.contains('on')){
    CW=cv.parentElement?cv.parentElement.clientWidth:360;
    CH=Math.round(CW*1.08);
    cv.width=CW;cv.height=CH;cv.style.height=CH+'px';
    const total=4*LW+3*LG,sx=(CW-total)/2;
    LANE_X=[0,1,2,3].map(i=>sx+i*(LW+LG)+LW/2);
    JUDGE_Y=CH*0.84;
    NOTE_SPEED=CH*0.00042;
  }
});
</script>
