var _cvRect=null,_cvRectT=0;
function getCVRect(){var n=Date.now();if(!_cvRect||n-_cvRectT>800){_cvRect=CV.getBoundingClientRect();_cvRectT=n;}return _cvRect;}
document.getElementById('gw').addEventListener('pointerdown',function(e){
  if(!gr||fall)return;
  try{var ac=getAC();if(ac&&ac.state==='suspended')ac.resume();}catch(x){}
  _cvRect=CV.getBoundingClientRect();_cvRectT=Date.now();
  var rect=_cvRect;
  var ex=(e.clientX-rect.left)*(W/rect.width),ey=(e.clientY-rect.top)*(H/rect.height);
  if(phase==='drawing'||phase==='flying'){
    if(pathClearTimer){clearTimeout(pathClearTimer);pathClearTimer=null;}
    CS.drawing=true;CS.path=[[ex,ey]];document.getElementById('gw').setPointerCapture(e.pointerId);
    _elDrawHint.style.opacity='0';return;
  }
  if(phase==='idle'){drag=true;dsx=ex;dsy=ey;pullAmt=0;pullDX=0;pullDY=0;phase='pulling';document.getElementById('gw').setPointerCapture(e.pointerId);}
});
document.getElementById('gw').addEventListener('pointermove',function(e){
  var rect=getCVRect();
  var ex=(e.clientX-rect.left)*(W/rect.width),ey=(e.clientY-rect.top)*(H/rect.height);
  if((phase==='drawing'||phase==='flying')&&CS.drawing&&CS.active){
    CS.path.push([ex,ey]);if(CS.path.length>300)CS.path.splice(0,CS.path.length-200);checkSegs();return;
  }
  if(!drag||phase!=='pulling')return;
  pullDX=ex-dsx;pullDY=ey-dsy;pullAmt=Math.min(130,Math.sqrt(pullDX*pullDX+pullDY*pullDY));
  curDP=getDirPose(pullDX,pullDY,pullAmt);
  // 수평 드래그 방향에 따라 줄 위 캐릭터 이동 (-1 ~ 1)
  // 반대 방향으로 위치 (왼쪽으로 당기면 캐릭터는 오른쪽에서 왼쪽 방향)
  if(pullAmt>15){
    var hRatio=pullDX/pullAmt; // -1(왼쪽)~+1(오른쪽)
    ropeCharOffsetTarget=hRatio*.6; // 당기는 방향으로 미끄러짐 (최대 60%)
  }
  if(pullAmt>20&&curDP.dir){_elPhDir.textContent=curDP.dir;_elPhName.textContent=curDP.label;_elPoseHint.style.opacity='1';}
  else _elPoseHint.style.opacity='0';
  if(curRopeIdx>=0&&curRopeIdx<ropes.length)ropes[curRopeIdx].ba=pullAmt*.4;
});
document.getElementById('gw').addEventListener('pointerup',function(e){
  _elPoseHint.style.opacity='0';

    CS.drawing=false;
    pathClearTimer=setTimeout(function(){pathClearTimer=null;if(CS.active&&!CS.done)CS.path=[];},180);return;
  }
  if(!drag)return;drag=false;if(phase!=='pulling')return;
  if(pullAmt>12)doLaunch();
  else{phase='idle';if(curRopeIdx>=0&&curRopeIdx<ropes.length){ropes[curRopeIdx].bv=-ropes[curRopeIdx].ba*.6;ropes[curRopeIdx].ba=0;}}
  pullAmt=0;pullDX=0;pullDY=0;
});

var dailyMissions=[]; // [{...template, progress, done, rewarded}]
var missionNoMissStreak=0; // 연속 착지 카운터

function generateDailyMissions(){
  var s=seed0();
  // 3개 미션을 템플릿에서 중복 없이 선택
  var used=[];var result=[];
  var order=[0,1,2,3,4,5,6].sort(function(a,b){return sr(s+a*77)-sr(s+b*31);});
  for(var i=0;i<order.length&&result.length<3;i++){
    var t=MISSION_TEMPLATES[order[i]];
    if(used.indexOf(t.type)<0){
      used.push(t.type);
      var m=t.gen(s+i*999);
      m.progress=0;m.done=false;m.rewarded=false;m.templateIdx=order[i];
      result.push(m);
    }
  }
  return result;
}

function initMissions(){
  var saved=missionLoad();
  var today=todayStr();
  if(saved&&saved.date===today){
    // 오늘 데이터 복원 — check 함수는 재생성 필요
    dailyMissions=saved.missions.map(function(m,i){
      var t=MISSION_TEMPLATES[m.templateIdx];
      var fresh=t.gen(seed0()+i*999);
      fresh.progress=m.progress;fresh.done=m.done;fresh.rewarded=m.rewarded;fresh.templateIdx=m.templateIdx;
      return fresh;
    });
  } else {
    dailyMissions=generateDailyMissions();
    missionSave({date:today,missions:dailyMissions.map(saveMissionData)});
  }
  updateMissionBadge();
}

function saveMissionData(m){
  return{templateIdx:m.templateIdx,progress:m.progress,done:m.done,rewarded:m.rewarded,key:m.key};
}

function updateMissionBadge(){
  var incomplete=dailyMissions.filter(function(m){return !m.done;}).length;
  var badge=document.getElementById('mhb-badge');
  if(badge)badge.style.display=incomplete>0?'block':'none';
}

// 미션 이벤트 트리거 (게임 중 호출)
function triggerMission(ev){
  var changed=false;
  dailyMissions.forEach(function(m){
    if(m.done)return;
    // no_miss 미션은 실패 시 리셋
    if(m.templateIdx===6&&ev.type==='fail'){
      m.progress=0;changed=true;return;
    }
    if(!m.check(ev))return;
    m.progress=Math.min(m.goal,m.progress+1);
    changed=true;
    if(m.progress>=m.goal&&!m.done){
      m.done=true;
      // 보상 지급
      if(!m.rewarded){
        m.rewarded=true;
        if(m.reward.type==='heart'){lv=Math.min(lv+m.reward.amount,9);updateHUD();}
        else if(m.reward.type==='score'){sc+=m.reward.amount;updateHUD();}
        // 완료 피드백
        var rStr=m.reward.type==='heart'?('♥ +'+m.reward.amount):('⭐ +'+m.reward.amount.toLocaleString()+'점');
        showFB('🎯 미션 완료!',m.title+'  '+rStr,'rgba(255,220,80,.9)');
        fsh=14;fsc='rgba(255,220,80,.2)';
        // 완료음
        [523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.3,.1);},i*60);});
      }
    }
  });
  if(changed){
    missionSave({date:todayStr(),missions:dailyMissions.map(saveMissionData)});
    updateMissionBadge();
  }
}

function claimAtt(){
  var today=todayStr(),yest=yesterdayStr();
  var pos=attData.totalDays%7;var r=ATT_REWARDS[pos];
  if(attData.lastDate===yest||attData.lastDate===null)attData.streak++;
  else if(attData.lastDate!==today)attData.streak=1;
  attData.totalDays++;attData.lastDate=today;attData.claimed=true;
  if(attData.streak>attData.bestStreak)attData.bestStreak=attData.streak;
  attSave(attData);attData._pendingReward=r;
  var btn=document.getElementById('att-btn');
  btn.textContent='✨ '+r.val+' 획득!';
  btn.style.background=r.special?'linear-gradient(90deg,#cc88ff,#88ddff)':'linear-gradient(90deg,#ffe97a,#ffcc44)';
  btn.style.color='#1a1000';
  setTimeout(function(){btn.style.background='';btn.style.color='';renderAtt();},900);
}

function selectSign(idx){
  selectedSign=idx;signSave(idx);
  document.querySelectorAll('.spk').forEach(function(e,i){e.classList.toggle('active',i===idx);});
  document.querySelectorAll('.fsgn').forEach(function(e,i){e.classList.toggle('active',i===idx);});
  var s=SIGNS[idx],f=getFortune(idx);

  fortuneBonus={heart:0,score:0,text:''};var bonusTxts=[];
  if(f.game>=80){fortuneBonus.heart+=2;bonusTxts.push('♥♥ 하트 +2');}
  else if(f.game>=60){fortuneBonus.heart+=1;bonusTxts.push('♥ 하트 +1');}
  if(f.star>=80){fortuneBonus.score+=1000;bonusTxts.push('⭐ 점수 +1000');}
  else if(f.star>=60){fortuneBonus.score+=300;bonusTxts.push('⭐ 점수 +300');}
  if(f.streak>=80){fortuneBonus.heart+=1;bonusTxts.push('♥ 하트 +1');}
  fortuneBonus.text=bonusTxts.join(' · ');
  // 시작화면 요약
  var sum=document.getElementById('sign-selected-summary');sum.style.display='block';

  document.getElementById('sss-period').textContent=s.period;
  var ov=f.overall;
  document.getElementById('sss-badge').textContent=
    (ov>=80?'🌟 오늘 운이 매우 좋아요!':ov>=60?'✨ 오늘 운이 좋은 편이에요':ov>=40?'☁️ 평범한 하루가 될 거예요':'🌙 조용히 집중하는 날이에요')
    +(bonusTxts.length?' · '+fortuneBonus.text+' 보너스':'');
  // HUD 버튼 업데이트
  document.getElementById('fhb-icon').innerHTML=s.svg;
  var _si=document.getElementById('fhb-icon').querySelector('svg');if(_si)_si.style.stroke=s.color;
  // 시작 버튼
  var btn=document.getElementById('start-btn');
  // 별자리별 시작 버튼 멘트
  var startLines=[
    '🔥 불꽃처럼 달려봐',   // 양자리
    '🌿 묵직하게 올라가자', // 황소자리
    '🌀 두 배로 빠르게',    // 쌍둥이자리
    '🌙 감으로 가는 거야',  // 게자리
    '⚡ 무대에 올라서',     // 사자자리
    '🌸 완벽하게 그려봐',   // 처녀자리
    '🪞 균형 잡고 출발',    // 천칭자리
    '🖤 끝까지 가는 거야',  // 전갈자리
    '🏹 목표만 봐',         // 사수자리
    '🏔 정상은 하나야',     // 염소자리
    '💫 나만의 길로 가자',  // 물병자리
    '🌊 흐름에 올라타',     // 물고기자리
  ];
  btn.disabled=false;btn.textContent=startLines[idx]||s.name+'으로 시작하기';
  // 모달 열려있으면 바로 렌더
  // 선택 별자리와 같은 이름의 CONSTS 인덱스 찾기 (없으면 -1)
  signBonusCI=-1;
  for(var _i=0;_i<CONSTS.length;_i++){
    if(CONSTS[_i].name===s.name||(s.name.replace('자리','')!==''&&CONSTS[_i].name.indexOf(s.name.replace('자리',''))>=0)){
      signBonusCI=_i;break;
    }

function renderFortuneModal(idx){
  var s=SIGNS[idx],f=getFortune(idx);
  document.getElementById('fm-card').style.display='block';
  // 오라 캔버스
  if(fmAuraAnim){cancelAnimationFrame(fmAuraAnim);fmAuraAnim=null;}
  var cv=document.getElementById('fm-aura'),c=cv.getContext('2d');
  var col=s.color;
  var hr=parseInt(col.slice(1,3),16),hg=parseInt(col.slice(3,5),16),hb=parseInt(col.slice(5,7),16);
  var startT=Date.now();
  function drawAura(){
    var t=(Date.now()-startT)/1000;
    c.clearRect(0,0,180,180);
    var cx=90,cy=90;
    // 바깥 오라 링
    [[0.22*f.overall/100,62,8],[0.14*f.overall/100,72,12],[0.07*f.overall/100,82,18]].forEach(function(rng){
      c.save();c.beginPath();c.arc(cx,cy,rng[1],0,Math.PI*2);
      c.strokeStyle='rgba('+hr+','+hg+','+hb+','+rng[0]+')';c.lineWidth=rng[2];c.stroke();c.restore();
    });
    // 회전 파티클
    var np=Math.max(4,Math.round(f.overall/15));
    for(var i=0;i<np;i++){
      var ang=i/np*Math.PI*2+t*(0.3+i*.04);
      var rad=48+Math.sin(t*1.2+i*1.1)*10;
      c.save();c.globalAlpha=0.4+Math.sin(t*2+i*0.8)*0.3;c.fillStyle=col;
      c.beginPath();c.arc(cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad,1.5+Math.sin(t+i)*0.7,0,Math.PI*2);c.fill();c.restore();
    }
    // 중앙 글로우
    var g2=c.createRadialGradient(cx,cy,0,cx,cy,28+f.overall*.12);
    g2.addColorStop(0,'rgba('+hr+','+hg+','+hb+',0.18)');g2.addColorStop(1,'rgba('+hr+','+hg+','+hb+',0)');
    c.fillStyle=g2;c.beginPath();c.arc(cx,cy,28+f.overall*.12,0,Math.PI*2);c.fill();
    // 맥동 링
    var pulse=Math.sin(t*2.5)*.5+.5;
    c.save();c.globalAlpha=pulse*.25;c.strokeStyle=col;c.lineWidth=2;
    c.beginPath();c.arc(cx,cy,32+pulse*16,0,Math.PI*2);c.stroke();c.restore();
    fmAuraAnim=requestAnimationFrame(drawAura);
  }
  drawAura();
  // 중앙 텍스트
  var _ai=document.getElementById('fm-aura-icon');_ai.innerHTML=s.svg;var _as=_ai.querySelector('svg');if(_as){_as.style.width='44px';_as.style.height='44px';_as.style.stroke=s.color;}
  document.getElementById('fm-aura-name').textContent=s.name;
  document.getElementById('fm-aura-name').style.color=col;
  var gl=f.overall>=80?'대길 (大吉)':f.overall>=65?'길 (吉)':f.overall>=50?'소길 (小吉)':f.overall>=35?'평 (平)':'주의';
  document.getElementById('fm-aura-grade').textContent=gl;
  document.getElementById('fm-aura-grade').style.color=mc(f.overall);
  // 운세 본문
  document.getElementById('fm-fortune-text').textContent=f.text;
  // 4가지 운 타일
  var tiles=[{label:'전체운',v:f.overall},{label:'게임운',v:f.game},{label:'별자리운',v:f.star},{label:'연속운',v:f.streak}];
  var tEl=document.getElementById('fm-tiles');tEl.innerHTML='';
  tiles.forEach(function(tile){
    var c2=mc(tile.v),hr2=parseInt(c2.slice(1,3),16),hg2=parseInt(c2.slice(3,5),16),hb2=parseInt(c2.slice(5,7),16);
    var div=document.createElement('div');div.className='fm-tile';
    div.style.borderColor='rgba('+hr2+','+hg2+','+hb2+',.3)';
    div.innerHTML='<div class="fm-tile-label">'+tile.label+'</div>'
      +'<div class="fm-tile-stars" style="color:'+c2+'">'+stars2(tile.v)+'</div>'
      +'<div class="fm-tile-val" style="color:'+c2+'">'+(tile.v>=80?'최고':tile.v>=60?'좋음':tile.v>=40?'보통':'낮음')+'</div>';
    tEl.appendChild(div);
  });
  // 키워드
  var kwEl=document.getElementById('fm-keywords');kwEl.innerHTML='';
  ['행운의 색: '+f.color,'행운의 숫자: '+f.num,'행운의 아이템: '+f.item].forEach(function(kw){
    var span=document.createElement('span');span.className='fm-kw';span.textContent=kw;kwEl.appendChild(span);
  });
  // 보너스
  var bonusEl=document.getElementById('fm-bonus');
  if(fortuneBonus.text&&idx===selectedSign){
    bonusEl.style.display='block';
    bonusEl.innerHTML='🎁 오늘의 게임 보너스: '+fortuneBonus.text+'<br><small style="opacity:.6;font-size:10px">✓ 게임 시작 시 자동으로 적용됩니다</small>';
  }else{bonusEl.style.display='none';}
}

function startGame(){
  // 출석 보상 적용
  if(attData&&attData._pendingReward){
    var r=attData._pendingReward;
    if(r.type==='heart')lv=Math.min(lv+r.amount,9);
    else if(r.type==='score')sc+=r.amount;
    attData._pendingReward=null;
  }
  // 운세 보너스 적용
  if(fortuneBonus&&fortuneBonus.heart>0)lv=Math.min(lv+fortuneBonus.heart,9);
  if(fortuneBonus&&fortuneBonus.score>0)sc+=fortuneBonus.score;
  updateHUD();
  // 시작화면 숨기기
  document.getElementById('start').style.display='none';
  setTimeout(function(){zanAnn(0);},300);
  setTimeout(function(){setZoneBGM(0);},500);
  // 선택한 별자리 맞춤 시작 메시지
  if(selectedSign>=0){
    var _s=SIGNS[selectedSign];
    var _f=getFortune(selectedSign);
    var _msg=_f.overall>=70?'오늘 '+_s.name+' 운이 좋아요!':_s.name+'으로 시작합니다';
    setTimeout(function(){showFB(_msg,_f.overall>=70?'별자리 보너스 적용됨 ✦':'달까지 올라가 봐요',_s.color);},800);
  } // zone 0 BGM 시작
}
