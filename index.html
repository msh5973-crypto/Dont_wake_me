<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Line to Moon">
<meta property="og:description" content="Draw constellations and ride the line all the way to the moon">
<meta property="og:type" content="website">
<meta name="theme-color" content="#03030f"><title>Line to Moon</title>
<meta name="description" content="Draw constellations and ride the line all the way to the moon">
<style>

*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#03030f;width:100vw;height:100svh;overflow:hidden;margin:0;padding:0;}
#gw{width:100vw;height:100svh;max-width:none;margin:0;position:fixed;top:0;left:0;overflow:hidden;background:#03030f;touch-action:none;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);}
canvas{display:block;position:absolute;top:50%;left:50%;transform-origin:center center;pointer-events:none;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;font-family:sans-serif;padding-top:env(safe-area-inset-top,0);}
#hud-top{display:flex;justify-content:space-between;padding:8px 12px 0;}
#htitle{font-size:9px;color:rgba(255,220,100,.4);letter-spacing:.14em;}
#hscore{font-size:14px;color:rgba(255,255,255,.6);margin-top:1px;}
#hcombo{font-size:12px;color:rgba(255,180,60,.9);margin-top:1px;min-height:15px;font-weight:500;}
#hlives{font-size:16px;letter-spacing:2px;margin-top:2px;}
#zone-bar{height:3px;width:100%;margin-top:5px;position:relative;overflow:visible;}
#zone-fill{height:100%;}
#zone-label{position:absolute;right:8px;top:-13px;font-size:9px;letter-spacing:.05em;}
#draw-hint{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .2s;text-align:center;white-space:nowrap;font-family:sans-serif;background:rgba(0,0,16,.55);border-radius:10px;padding:7px 16px;}
#draw-hint-main{font-size:13px;font-weight:500;}
#draw-hint-sub{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
#feedback{position:absolute;left:50%;transform:translateX(-50%);top:32%;pointer-events:none;opacity:0;transition:opacity .08s;text-align:center;white-space:nowrap;font-family:sans-serif;}
#fb-main{font-size:28px;font-weight:600;}
#fb-sub{font-size:13px;margin-top:4px;opacity:.85;}
#zan{position:absolute;left:50%;top:56px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .1s;text-align:center;font-family:sans-serif;background:rgba(0,0,16,.6);border-radius:12px;padding:10px 22px;white-space:nowrap;}
#zan-layer{font-size:10px;letter-spacing:.2em;opacity:.7;}
#zan-name{font-size:22px;font-weight:500;margin-top:3px;}
#zan-desc{font-size:11px;margin-top:4px;opacity:.6;}
#pose-hint{position:absolute;bottom:22%;left:12px;pointer-events:none;opacity:0;transition:opacity .15s;text-align:left;font-family:sans-serif;}
#ph-dir{font-size:20px;color:rgba(255,200,80,.9);}
#ph-name{font-size:10px;color:rgba(255,200,80,.6);margin-top:2px;}
#go{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,3,18,.95);font-family:sans-serif;padding:24px;}
#go h2{font-size:24px;color:#ffe97a;font-weight:500;}
#go p{font-size:12px;color:rgba(255,255,255,.4);margin-top:6px;}
#go-consts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 4px;max-width:320px;}
.go-c{font-size:11px;padding:4px 9px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);}
#rb{margin-top:14px;padding:9px 28px;background:transparent;border:1px solid rgba(255,220,80,.4);color:#ffe97a;font-size:12px;border-radius:8px;cursor:pointer;}
#go-ad-heart{margin-top:8px;padding:9px 28px;display:none;background:linear-gradient(90deg,#44aaff,#66ffcc);color:#001a22;font-size:12px;font-weight:700;border:none;border-radius:8px;cursor:pointer;}
#go-continue{margin-top:8px;padding:9px 28px;background:linear-gradient(90deg,#ffe97a,#ffcc44);color:#1a1000;font-size:12px;font-weight:700;border:none;border-radius:8px;cursor:pointer;display:none;}
/* ── 엔딩 오버레이 ── */
#ending{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(1,0,8,.97);font-family:sans-serif;z-index:100;padding:24px;}
#ending-title{font-size:28px;color:#ffe97a;font-weight:500;text-align:center;margin-bottom:6px;}
#ending-sub{font-size:13px;color:rgba(255,238,155,.55);text-align:center;letter-spacing:.1em;margin-bottom:20px;}
#ending-score{font-size:20px;color:#fff;text-align:center;margin-bottom:4px;}
#ending-best{font-size:12px;color:rgba(255,220,80,.5);text-align:center;margin-bottom:18px;}
#ending-consts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin-bottom:22px;}
.end-c{font-size:13px;padding:6px 12px;border-radius:16px;border:1px solid;opacity:0;transition:opacity .4s;}
#ending-btn{padding:12px 36px;background:linear-gradient(90deg,#ffe97a,#ffcc44);color:#1a1000;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer;}
/* ── HUD 미션 버튼 ── */
#mission-hud-btn{position:absolute;top:6px;right:90px;pointer-events:auto;background:none;border:none;cursor:pointer;opacity:.55;transition:opacity .15s;font-family:sans-serif;text-align:center;line-height:1;}
#mission-hud-btn:hover{opacity:1;}
#mhb-icon{font-size:18px;}
#mhb-label{font-size:7px;color:rgba(255,255,255,.5);letter-spacing:.04em;display:block;margin-top:1px;}
#mission-hud-btn .mhb-badge{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#ff6644;display:none;}
/* ── 미션 모달 ── */
#mission-modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;display:none;flex-direction:column;background:rgba(2,3,16,.97);font-family:sans-serif;overflow-y:auto;}
#mm-header{display:flex;align-items:center;padding:20px 18px 0;gap:10px;}
#mm-title-text{font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.18em;text-transform:uppercase;}
#mm-close{background:none;border:none;color:rgba(255,255,255,.3);font-size:20px;cursor:pointer;line-height:1;padding:4px 8px;margin-left:auto;touch-action:manipulation;}
#mm-body{padding:14px 16px 32px;}
#mm-summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:14px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;}
#mm-summary-prog{font-size:22px;font-weight:300;color:#fff;}
#mm-summary-prog span{font-size:11px;color:rgba(255,255,255,.3);font-weight:400;margin-left:4px;}
#mm-reset{font-size:10px;color:rgba(255,255,255,.25);text-align:right;line-height:1.5;}
#mm-reset b{color:rgba(255,200,80,.5);font-weight:400;}
.mm-card{border-radius:16px;padding:0;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.07);}
.mm-card-inner{padding:16px 16px 14px;background:rgba(255,255,255,.03);}
.mm-card.done .mm-card-inner{background:rgba(255,220,80,.04);}
.mm-card.done{border-color:rgba(255,220,80,.18);}
.mm-card-row1{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px;}
.mm-card-icon-wrap{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;background:rgba(255,255,255,.04);}
.mm-card.done .mm-card-icon-wrap{border-color:rgba(255,220,80,.25);background:rgba(255,220,80,.07);}
.mm-card-texts{flex:1;min-width:0;}
.mm-card-title{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);line-height:1.3;margin-bottom:3px;}
.mm-card.done .mm-card-title{color:rgba(255,220,80,.85);}
.mm-card-desc{font-size:11px;color:rgba(255,255,255,.32);line-height:1.5;}
.mm-card-badge{flex-shrink:0;font-size:10px;padding:3px 8px;border-radius:8px;font-weight:500;background:rgba(255,220,80,.12);color:rgba(255,220,80,.7);border:1px solid rgba(255,220,80,.2);white-space:nowrap;}
.mm-card.done .mm-card-badge{background:rgba(255,220,80,.2);color:#ffe97a;}
.mm-prog-wrap{display:flex;align-items:center;gap:10px;}
.mm-prog-bar{flex:1;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.mm-prog-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.mm-prog-txt{font-size:10px;color:rgba(255,255,255,.28);white-space:nowrap;}
.mm-done-stamp{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:50%;background:rgba(255,220,80,.15);border:1px solid rgba(255,220,80,.3);display:flex;align-items:center;justify-content:center;font-size:11px;}
/* 도감 버튼 위치 조정 */
#codex-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:180;pointer-events:auto;touch-action:manipulation;background:rgba(20,25,50,.85);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 13px;font-size:11px;color:rgba(255,255,255,.65);font-family:sans-serif;cursor:pointer;}
/* 미션 버튼 (게임화면 하단) */
#mission-game-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));z-index:180;pointer-events:auto;touch-action:manipulation;background:rgba(20,25,50,.85);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:8px 13px;font-size:11px;color:rgba(255,255,255,.65);font-family:sans-serif;cursor:pointer;}
#codex{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;display:none;flex-direction:column;background:rgba(3,3,18,.97);font-family:sans-serif;overflow-y:auto;}
#codex-header{display:flex;align-items:center;padding:16px 16px 0;}
#codex-close{background:none;border:none;color:rgba(255,255,255,.4);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;margin-left:auto;}
#codex-title{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.12em;}
#codex-body{padding:16px;display:flex;flex-direction:column;align-items:center;}
#codex-stats{font-size:11px;color:rgba(255,255,255,.3);margin-bottom:14px;text-align:center;}
#codex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px;}
.cdx-item{border-radius:10px;padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);position:relative;}
.cdx-item.unlocked{background:rgba(255,255,255,.07);}
.cdx-icon{font-size:22px;margin-bottom:3px;}
.cdx-name{font-size:9px;color:rgba(255,255,255,.4);}
.cdx-item.unlocked .cdx-name{color:rgba(255,255,255,.75);}
.cdx-cnt{font-size:8px;color:rgba(255,255,255,.25);margin-top:2px;}
.cdx-item.unlocked .cdx-cnt{color:rgba(255,220,80,.5);}
.cdx-lock{position:absolute;top:4px;right:5px;font-size:8px;opacity:.2;}
.cdx-diff{position:absolute;top:4px;left:5px;font-size:7px;opacity:.4;}

/* ── 시작화면 ── */
#start{position:fixed;top:0;left:0;width:100%;height:100%;background:#03030f;z-index:200;overflow-y:auto;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;}
#start h1{font-size:18px;color:#ffe97a;letter-spacing:.15em;text-align:center;margin-bottom:2px;}
#start .game-sub{font-size:10px;color:rgba(255,220,80,.35);letter-spacing:.2em;text-align:center;margin-bottom:20px;}
/* 출석 카드 */
.card{width:100%;max-width:360px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:16px;margin-bottom:14px;}
.card-title{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.08em;margin-bottom:12px;}
/* 출석 7일 */
#att-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px;}
.aday{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;position:relative;}
.aday.done{background:rgba(255,220,80,.12);border:1px solid rgba(255,220,80,.3);}
.aday.today{background:rgba(255,220,80,.22);border:2px solid #ffe97a;box-shadow:0 0 10px rgba(255,220,80,.3);}
.aday.future{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);}
.aday.special.today{background:rgba(180,100,255,.18);border:2px solid #cc88ff;box-shadow:0 0 10px rgba(180,100,255,.3);}
.aday.special.done{background:rgba(180,100,255,.12);border:1px solid rgba(180,100,255,.3);}
.aday-n{font-size:7px;color:rgba(255,255,255,.25);margin-bottom:1px;}
.aday-i{font-size:13px;line-height:1.2;}
.aday-v{font-size:7px;color:rgba(255,255,255,.35);}
.aday.done .aday-v,.aday.today .aday-v{color:rgba(255,220,80,.6);}
.achk{position:absolute;top:1px;right:3px;font-size:7px;color:#ffe97a;}
#att-reward{background:rgba(255,220,80,.07);border-radius:8px;padding:10px;text-align:center;margin-bottom:10px;}
#att-reward-icon{font-size:20px;}
#att-reward-txt{font-size:12px;color:#ffe97a;margin-top:2px;}
#att-btn{width:100%;padding:10px;background:linear-gradient(90deg,#ffe97a,#ffcc44);color:#1a1000;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer;}
#att-btn:disabled{background:rgba(255,255,255,.08);color:rgba(255,255,255,.25);}
#att-streak{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:8px;}
#att-streak span{color:rgba(255,220,80,.6);}
/* 시작화면 별자리 선택 미니 그리드 */
#sign-pick-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:14px;}
.spk{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;transition:all .1s;}
.spk:active{transform:scale(.93);}
.spk.active{border-color:var(--sc)!important;background:rgba(255,255,255,.1);}
.spk-i{line-height:1;display:flex;align-items:center;justify-content:center;height:26px;}
.spk-i svg{width:22px;height:22px;display:block;stroke-width:1.5;}
.spk-n{font-size:7px;color:rgba(255,255,255,.35);margin-top:1px;}
.spk.active .spk-n{color:rgba(255,255,255,.75);}
/* 선택된 별자리 요약 (시작화면) */
#sign-selected-summary{display:none;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;margin-bottom:14px;width:100%;max-width:360px;}
#sss-row{display:flex;align-items:center;gap:10px;}
#sss-icon{line-height:1;display:flex;align-items:center;width:36px;height:36px;}
#sss-icon svg{width:32px;height:32px;display:block;}
#sss-info{flex:1;}
#sss-name{font-size:14px;font-weight:500;}
#sss-period{font-size:10px;color:rgba(255,255,255,.3);margin-top:1px;}
#sss-badge{font-size:11px;color:rgba(255,255,255,.45);margin-top:5px;font-style:italic;line-height:1.5;}
#sss-fortune-btn{font-size:11px;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;}
/* ── HUD 운세 버튼 ── */
#fortune-hud-btn{position:absolute;top:6px;right:50px;pointer-events:auto;background:none;border:none;cursor:pointer;opacity:.55;transition:opacity .15s;font-family:sans-serif;text-align:center;line-height:1;}
#fortune-hud-btn:hover{opacity:1;}
#fhb-icon{display:flex;align-items:center;justify-content:center;}
#fhb-icon svg{width:20px;height:20px;display:block;}
#fhb-label{font-size:7px;color:rgba(255,255,255,.5);letter-spacing:.04em;display:block;margin-top:1px;}
/* ── 운세 모달 ── */
#fortune-modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:500;display:none;flex-direction:column;background:rgba(3,3,18,.97);font-family:sans-serif;overflow-y:auto;}
#fm-header{display:flex;align-items:center;padding:16px 16px 0;gap:12px;}
#fm-close{background:none;border:none;color:rgba(255,255,255,.4);font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;margin-left:auto;}
#fm-title{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.12em;}
#fm-body{padding:16px;display:flex;flex-direction:column;align-items:center;}
/* 별자리 선택 그리드 (모달) */
#fm-sign-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:400px;margin-bottom:20px;}
.fsgn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 3px;text-align:center;cursor:pointer;transition:all .1s;}
.fsgn.active{border-color:var(--sc)!important;background:rgba(255,255,255,.08);}
.fsgn-i{margin-bottom:2px;display:flex;align-items:center;justify-content:center;height:28px;}
.fsgn-i svg{width:24px;height:24px;display:block;}
.fsgn-n{font-size:8px;color:rgba(255,255,255,.4);}
.fsgn.active .fsgn-n{color:rgba(255,255,255,.8);}
/* 운세 카드 */
#fm-card{width:100%;max-width:400px;display:none;}
/* 오라 캔버스 */
#fm-aura-wrap{position:relative;width:180px;height:180px;margin:0 auto 16px;}
#fm-aura{display:block;}
#fm-aura-sign{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
#fm-aura-icon{display:block;line-height:1;}
#fm-aura-name{font-size:12px;font-weight:500;margin-top:2px;}
#fm-aura-grade{font-size:10px;margin-top:2px;opacity:.7;}
/* 운세 본문 */
#fm-fortune-text{font-size:13px;color:rgba(255,255,255,.65);line-height:1.8;text-align:center;max-width:360px;margin-bottom:18px;padding:0 4px;}
/* 4가지 운 타일 */
#fm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:400px;margin-bottom:16px;}
.fm-tile{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:12px;text-align:center;}
.fm-tile-label{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:6px;letter-spacing:.05em;}
.fm-tile-stars{font-size:16px;letter-spacing:2px;margin-bottom:4px;}
.fm-tile-val{font-size:10px;font-weight:500;}
/* 오늘의 키워드 */
#fm-keywords{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
.fm-kw{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);}
/* 보너스 배너 */
#fm-bonus{width:100%;max-width:400px;background:rgba(100,220,255,.07);border:1px solid rgba(100,220,255,.18);border-radius:10px;padding:12px 14px;font-size:12px;color:rgba(100,220,255,.9);text-align:center;line-height:1.6;margin-bottom:8px;display:none;}
/* 시작 버튼 */
#start-btn{width:100%;max-width:360px;padding:16px;background:linear-gradient(90deg,#ffe97a,#ffcc44);color:#1a1000;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer;letter-spacing:.06em;margin-top:4px;}
#start-btn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.3);}

/* ── 튜토리얼 오버레이 ── */
#tut{position:fixed;top:0;left:0;width:100%;height:100%;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,3,18,.92);font-family:sans-serif;padding:24px;}
#tut-step{text-align:center;max-width:320px;}
#tut-icon{font-size:54px;margin-bottom:14px;line-height:1;}
#tut-title{font-size:18px;color:#ffe97a;font-weight:500;margin-bottom:8px;}
#tut-desc{font-size:13px;color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:24px;}

<script>


// ── 앱인토스 SDK 데이터 저장 래퍼 ──────────────────────
// AIT.storage가 있으면 SDK 사용, 없으면 localStorage fallback
var AIT_STORAGE = {
  get: function(key){
    try{
      if(window.AIT&&window.AIT.storage)return window.AIT.storage.getItem(key);
      return localStorage.getItem(key);
    }catch(e){return null;}
  },
  set: function(key,val){
    try{
      if(window.AIT&&window.AIT.storage)return window.AIT.storage.setItem(key,val);
      localStorage.setItem(key,val);
    }catch(e){}
  }
};
// 기존 localStorage 직접 호출을 AIT_STORAGE로 교체
// ── 캔버스 초기화 ──────────────────────────────
var CV=document.getElementById('c'),ctx=CV.getContext('2d');
var W=680,H=960;
CV.width=W;CV.height=H;
// 화면 크기에 맞게 캔버스 스케일
function fitCanvas(){
  var scaleX=window.innerWidth/W;
  var scaleY=window.innerHeight/H;
  var scale=Math.min(scaleX,scaleY);
  CV.style.transform='translate(-50%,-50%) scale('+scale+')';
  CV.style.width=W+'px';
  CV.style.height=H+'px';
  // 터치/마우스 좌표 보정용
  CV._scale=scale;
}
fitCanvas();
window.addEventListener('resize',function(){fitCanvas();_cvRect=null;},{passive:true});
var CDY=Math.round(H*.78);      // 캐릭터 발 기준선 (749px)
var CHAR_OFS=31;                 // 발(y=2.6*12)이 CDY에 닿도록 중심 오프셋

// ── 오디오 ─────────────────────────────────────
var _AC=null;
function getAC(){if(!_AC)try{_AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return _AC;}
// 모바일 웹뷰: 첫 터치 시 AudioContext 반드시 resume
function ensureAudio(){var ac=getAC();if(ac&&ac.state==='suspended')ac.resume().catch(function(){});}
document.addEventListener('touchstart',ensureAudio,{once:true,passive:true});
document.addEventListener('pointerdown',ensureAudio,{once:true,passive:true});
function tone(f,d,v,t){
  v=v||.12;t=t||'sine';
  try{var ac=getAC();if(!ac)return;var o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);o.type=t;o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(v,ac.currentTime+.025);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+.05);}catch(e){}
}
var PENTA=[261,294,330,392,440,523,587,659,784,880];
function starSnd(i){tone(PENTA[i%10],.18,.13);tone(PENTA[i%10]*2,.1,.04);}
function completeSnd(lvl){
  var cs=[[523,659,784],[587,740,880],[659,784,988],[784,988,1175]][Math.min(lvl,3)];
  cs.forEach(function(f,i){setTimeout(function(){tone(f,.55,.14);},i*28);});
  setTimeout(function(){cs.forEach(function(f,i){setTimeout(function(){tone(f*1.5,.3,.07);},i*22);});},320);
}
var bgmNd=[];
var bgmZone=-1;
var bgmMaster=null; // 전역 마스터 버스 (컴프레서 포함)
var bgmFadeId=null;
var bgmLayerGains=[null,null,null,null]; // 콤보 레이어별 gain 노드

// ── 마스터 버스 (컴프레서 + 리미터) ──────────────
function getMaster(){
  if(bgmMaster)return bgmMaster;
  var ac=getAC();if(!ac)return null;
  var comp=ac.createDynamicsCompressor();
  comp.threshold.value=-24;comp.knee.value=8;
  comp.ratio.value=6;comp.attack.value=0.003;comp.release.value=0.25;
  var g=ac.createGain();g.gain.value=0.65; // 피로감 감소를 위해 볼륨 소폭 낮춤
  comp.connect(g);g.connect(ac.destination);
  bgmMaster={comp:comp,gain:g,node:comp}; // connect to this
  return bgmMaster;
}

// ── 페이드 유틸 ──────────────────────────────────
function fadeGain(gainNode,from,to,dur){
  var ac=getAC();if(!ac)return;
  gainNode.gain.cancelScheduledValues(ac.currentTime);
  gainNode.gain.setValueAtTime(from,ac.currentTime);
  gainNode.gain.linearRampToValueAtTime(to,ac.currentTime+dur);
}

function stopAll(){
  if(bgmFadeId){clearTimeout(bgmFadeId);bgmFadeId=null;}
  bgmNd.forEach(function(n){
    if(n&&n.stop)try{n.stop();}catch(e){}
    if(n&&n.disconnect)try{n.disconnect();}catch(e){}
  });
  bgmNd=[];
  bgmLayerGains=[null,null,null,null];
  // 마스터 버스는 유지 (재사용)
}

// ── stopAll 페이드 버전 ──────────────────────────
function fadeOutAndStop(cb){
  var ac=getAC();
  if(!ac||!bgmMaster){stopAll();if(cb)cb();return;}
  var m=bgmMaster.gain;
  var cur=m.gain.value||0.8;
  fadeGain(m,cur,0,0.4);
  bgmFadeId=setTimeout(function(){
    stopAll();
    if(bgmMaster)fadeGain(bgmMaster.gain,0,0.8,0.01);
    if(cb)cb();
  },420);
}

// ── setBGM: 콤보 레이어만 추가 (BGM 재시작 없이) ─
function setBGM(lvl){
  if(lvl===0){setZoneBGM(zoneIdx);return;}
  // 재시작 없이 현재 BGM 위에 레이어만 추가
  addComboLayer(lvl);
}

// ── 콤보 레이어 (재시작 없이 점진적으로 추가) ────
function addComboLayer(lvl){
  var ac=getAC();if(!ac)return;
  var m=getMaster();if(!m)return;
  var z=zoneIdx;
  // 이미 있는 레이어는 스킵
  if(bgmLayerGains[lvl])return;
  var g=ac.createGain();g.gain.value=0;g.connect(m.node);
  bgmLayerGains[lvl]=g;
  // 구간별 콤보 레이어 음색
  var freqs=[[261.6,392,523],[293.7,440,587],[329.6,493.9,659],[392,587,784]];
  var fl=freqs[Math.min(lvl-1,3)];
  fl.forEach(function(f,i){
    var o=ac.createOscillator(),og=ac.createGain();
    o.type='sine';o.frequency.value=f*(z>=4?1.5:1);
    og.gain.value=.006+i*.002;
    o.connect(og);og.connect(g);o.start();bgmNd.push(o);
  });
  // 페이드인
  fadeGain(g,0,.9+lvl*.1,1.2);
}

// ── 구간별 BGM ────────────────────────────────────
function setZoneBGM(zi,comboLvl){
  var prevZone=bgmZone;
  fadeOutAndStop(function(){
    bgmZone=zi;
    _startZoneBGM(zi,comboLvl||bgmLvl);
  });
}

function _startZoneBGM(zi,lv){
  var ac=getAC();if(!ac||ac.state==='suspended')return;
  var m=getMaster();if(!m)return;
  lv=Math.min(lv||0,3);

  // ── Zone 0: 도시 야경 — 로우파이 시티팝 ─────────
  // Cm7 재즈 그루브: 베이스 워킹 + 패드 + 딜레이 에코
  if(zi===0){
    // 베이스라인 (C1 삼각파, 느린 워블)
    var b=ac.createOscillator(),bg=ac.createGain();
    b.type='triangle';b.frequency.value=65.4;bg.gain.value=.028;
    b.connect(bg);bg.connect(m.node);b.start();
    bgmNd.push(b);

    // Cm7 코드 패드 (C3 Eb3 G3 Bb3) — 부드러운 사인파
    [[130.8,.009],[155.6,.008],[196,.007],[233.1,.006]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],1.5+i*.3); // 하나씩 페이드인
    });

    // 딜레이 에코 버스
    var dly=ac.createDelay(1.0),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.36;dfb.gain.value=.38;dg.gain.value=.18;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // 하이햇 제거 (딱딱 소리 방지)

    // 콤보 레이어 — 멜로디 노트 (Cm7 분산)
    if(lv>=2){
      var mId=setInterval(function(){
        try{var ac2=getAC();var notes=[261.6,311.1,392,466.2,523.3];
        var n=notes[Math.floor(Math.random()*notes.length)];
        var o=ac2.createOscillator(),g=ac2.createGain();
        o.type='triangle';o.frequency.value=n;
        g.gain.setValueAtTime(0,ac2.currentTime);
        g.gain.linearRampToValueAtTime(.018,ac2.currentTime+.06);
        g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+.8);
        o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+.85);}catch(e){}
      },480);
      bgmNd.push({stop:function(){clearInterval(mId);}});
    }
  }

  // ── Zone 1: 구름 속 — 드리프팅 앰비언트 ─────────
  // Db메이저: 느린 코드 변환, 딥 패드, 에어리 멜로디
  else if(zi===1){
    var dly=ac.createDelay(2.0),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.72;dfb.gain.value=.55;dg.gain.value=.22;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // Db 패드 (Db3 F3 Ab3 — 메이저 코드)
    [[138.6,.015],[174.6,.012],[207.7,.01]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);g.connect(dly);
      o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],2.0+i*.5);
    });

    // 에어리 멜로디 (Db 메이저 스케일)
    var airMel=[277.2,311.1,349.2,369.9,415.3,466.2];var airIdx=0;
    var airId=setInterval(function(){
      try{var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sine';o.frequency.value=airMel[airIdx%airMel.length];
      g.gain.setValueAtTime(0,ac2.currentTime);
      g.gain.linearRampToValueAtTime(.016,ac2.currentTime+.15);
      g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+2.0);
      o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+2.2);
      airIdx+=Math.random()>.6?2:1;}catch(e){}
    },1400);
    bgmNd.push({stop:function(){clearInterval(airId);}});

    if(lv>=2){
      // 하모닉 레이어 추가
      var o2=ac.createOscillator(),g2=ac.createGain();
      o2.type='sine';o2.frequency.value=277.2*2;g2.gain.value=0;
      o2.connect(g2);g2.connect(dly);o2.start();bgmNd.push(o2);
      fadeGain(g2,0,.008,2.0);
    }
  }

  // ── Zone 2: 오로라 — 스펙트럼 모핑 앰비언트 ──────
  // Em계열: 천천히 변하는 화음 + 고음 스위프
  else if(zi===2){
    var dly=ac.createDelay(1.5),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.9;dfb.gain.value=.5;dg.gain.value=.2;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // Em 드론 (E2 B2 E3)
    [[82.4,.02],[123.5,.016],[164.8,.012]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);g.connect(dly);
      o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],2.5+i*.8);
    });

    // 오로라 스위프 — 천천히 올라가는 사인파 (규칙적, 겹침)
    var swIdx=0;var swFreqs=[300,380,450,520,600];
    var swId=setInterval(function(){
      try{var ac2=getAC();var f=swFreqs[swIdx%swFreqs.length];
      var o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f,ac2.currentTime);
      o.frequency.linearRampToValueAtTime(f*2.2,ac2.currentTime+3.5);
      g.gain.setValueAtTime(0,ac2.currentTime);
      g.gain.linearRampToValueAtTime(.014,ac2.currentTime+.8);
      g.gain.linearRampToValueAtTime(0,ac2.currentTime+3.5);
      o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+3.6);
      swIdx++;}catch(e){}
    },2200);
    bgmNd.push({stop:function(){clearInterval(swId);}});

    if(lv>=2){
      // 5도 위 하모닉
      var o3=ac.createOscillator(),g3=ac.createGain();
      o3.type='sine';o3.frequency.value=185;g3.gain.value=0;
      o3.connect(g3);g3.connect(dly);o3.start();bgmNd.push(o3);
      fadeGain(g3,0,.01,2.0);
    }
    if(lv>=3){
      // 오로라 상단 하모닉 (사인파, 부드럽게)
      var o3=ac.createOscillator(),g3=ac.createGain();
      o3.type='sine';o3.frequency.value=329.6;g3.gain.value=0;
      o3.connect(g3);g3.connect(dly);o3.start();bgmNd.push(o3);
      fadeGain(g3,0,.007,2.0);
    }

  // ── Zone 3: 별빛 바다 — 우주 펜타토닉 ───────────
  // Am 펜타: 깊은 드론 + 별빛 아르페지오
  else if(zi===3){
    var dly=ac.createDelay(1.0),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.48;dfb.gain.value=.42;dg.gain.value=.25;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // Am 드론 (A1 E2 A2)
    [[55,.022],[82.4,.016],[110,.012]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);
      o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],1.8+i*.4);
    });

    // 별빛 아르페지오 (Am 펜타 — A C D E G 오름/내림)
    var starSeq=[220,261.6,293.7,329.6,392,440,392,329.6,293.7,261.6];
    var sIdx=0;
    var sId=setInterval(function(){
      try{var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sine';o.frequency.value=starSeq[sIdx%starSeq.length]*2;
      g.gain.setValueAtTime(0,ac2.currentTime);
      g.gain.linearRampToValueAtTime(.018,ac2.currentTime+.06);
      g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+1.1);
      o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+1.2);
      sIdx++;}catch(e){}
    },750);
    bgmNd.push({stop:function(){clearInterval(sId);}});

    if(lv>=2){
      var o2=ac.createOscillator(),g2=ac.createGain();
      o2.type='sine';o2.frequency.value=165;g2.gain.value=0;
      o2.connect(g2);g2.connect(m.node);o2.start();bgmNd.push(o2);
      fadeGain(g2,0,.009,1.5);
    }
    if(lv>=3){
      // 은하수 shimmer (고음 랜덤)
      var shId=setInterval(function(){
        if(Math.random()>.5)try{
          var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
          o.type='sine';o.frequency.value=880+Math.random()*440;
          g.gain.setValueAtTime(0,ac2.currentTime);
          g.gain.linearRampToValueAtTime(.008,ac2.currentTime+.05);
          g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+.6);
          o.connect(g);g.connect(m.node);o.start();o.stop(ac2.currentTime+.7);
        }catch(e){}
      },500);
      bgmNd.push({stop:function(){clearInterval(shId);}});
    }
  }

  // ── Zone 4: 운석우 — 다크 테크노 펄스 ───────────
  // Dm: 긴장된 베이스 + 드럼 그루브 + 디스토션 느낌
  else if(zi===4){
    var dly=ac.createDelay(0.5),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.22;dfb.gain.value=.25;dg.gain.value=.15;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // Dm 베이스 (D1 A1 D2 — 낮고 묵직한 톱니파)
    [[36.7,.022],[55,.016],[73.4,.012]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sawtooth';o.frequency.value=p[0];g.gain.value=0;
      var lfo=ac.createOscillator(),lg=ac.createGain();
      lfo.frequency.value=.5; // 0.5Hz = 2박자마다 펄스
      lg.gain.value=p[1]*.6;
      lfo.connect(lg);lg.connect(g.gain);
      o.connect(g);g.connect(m.node);
      o.start();lfo.start();bgmNd.push(o,lfo);
      fadeGain(g,0,p[1],1.2+i*.3);
    });

    // 운석우: 드럼 대신 긴장감 있는 베이스 펄스 (딱딱 소리 방지)
    // 베이스가 LFO로 펄스하며 긴장감 표현
    var tensionOsc=ac.createOscillator(),tg=ac.createGain();
    tensionOsc.type='sine';tensionOsc.frequency.value=110;tg.gain.value=0;
    tensionOsc.connect(tg);tg.connect(m.node);
    tensionOsc.start();bgmNd.push(tensionOsc);
    fadeGain(tg,0,.018,1.5);

    if(lv>=2){
      // 긴장 멜로디 — 사인파로 부드럽게 (square 제거)
      var rSeq=[146.8,155.6,174.6,164.8,146.8];var rIdx=0;
      var rId=setInterval(function(){
        try{var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
        o.type='sine';o.frequency.value=rSeq[rIdx%rSeq.length]*2;
        g.gain.setValueAtTime(0,ac2.currentTime);
        g.gain.linearRampToValueAtTime(.010,ac2.currentTime+.08); // 부드럽게
        g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+.8);
        o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+.9);
        rIdx++;}catch(e){}
      },800);
      bgmNd.push({stop:function(){clearInterval(rId);}});
    }
    if(lv>=3){
      var o2=ac.createOscillator(),g2=ac.createGain();
      o2.type='sawtooth';o2.frequency.value=110;g2.gain.value=0;
      o2.connect(g2);g2.connect(dly);o2.start();bgmNd.push(o2);
      fadeGain(g2,0,.008,1.0);
    }
  }

  // ── Zone 5: 우주 경계 — 진공 앰비언트 ───────────
  // 초저음 드론 + 드넓은 공간감 + 희귀한 신호음
  else if(zi===5){
    var dly=ac.createDelay(2.0),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=1.2;dfb.gain.value=.62;dg.gain.value=.28;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // G 계열 극저음 드론 (G0 D1 G1 — 우주 공명)
    [[24.5,.018],[36.7,.014],[49,.011]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);g.connect(dly);
      o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],3.0+i*.8);
    });

    // 화이트노이즈 우주 바람 (지속 루프)
    try{
      var nbuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
      var nd=nbuf.getChannelData(0);
      for(var i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.012;
      var nsrc=ac.createBufferSource(),ng=ac.createGain(),nf=ac.createBiquadFilter();
      nsrc.buffer=nbuf;nsrc.loop=true;
      nf.type='bandpass';nf.frequency.value=400;nf.Q.value=0.3;
      ng.gain.value=0;
      nsrc.connect(nf);nf.connect(ng);ng.connect(m.node);nsrc.start();
      bgmNd.push(nsrc);
      fadeGain(ng,0,.25,4.0);

    }catch(e){}

    // 우주 신호음 (2~5초 간격, 매우 희귀하게)
    var pingId=setInterval(function(){
      if(Math.random()>.55)try{
        var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
        o.type='sine';o.frequency.value=800+Math.random()*1200;
        g.gain.setValueAtTime(0,ac2.currentTime);
        g.gain.linearRampToValueAtTime(.02,ac2.currentTime+.06);
        g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+2.5);
        o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+2.6);
      }catch(e){}
    },3000+Math.random()*2000);
    bgmNd.push({stop:function(){clearInterval(pingId);}});

    if(lv>=2){
      var o2=ac.createOscillator(),g2=ac.createGain();
      o2.type='sine';o2.frequency.value=73.4;g2.gain.value=0;
      o2.connect(g2);g2.connect(dly);o2.start();bgmNd.push(o2);
      fadeGain(g2,0,.01,2.5);
    }
  }

  // ── Zone 6: 달 — 황금 코랄 + 첼레스타 느낌 ──────
  // C 메이저: 순수하고 성스러운 화음 + 반짝이는 멜로디
  else if(zi===6){
    var dly=ac.createDelay(1.2),dfb=ac.createGain(),dg=ac.createGain();
    dly.delayTime.value=.68;dfb.gain.value=.52;dg.gain.value=.3;
    dly.connect(dfb);dfb.connect(dly);dly.connect(dg);dg.connect(m.node);

    // C 메이저 코드 (C3 E3 G3 C4)
    [[130.8,.018],[164.8,.015],[196,.013],[261.6,.011]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(m.node);g.connect(dly);
      o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],1.5+i*.4);
    });

    // 첼레스타 멜로디 (C 메이저 오르내림, 부드럽게)
    var moonSeq=[523.2,587.3,659.3,784,880,988,1047,988,880,784,659.3,587.3];
    var mIdx=0;
    var mId=setInterval(function(){
      try{var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
      o.type='sine';o.frequency.value=moonSeq[mIdx%moonSeq.length];
      g.gain.setValueAtTime(0,ac2.currentTime);
      g.gain.linearRampToValueAtTime(.022,ac2.currentTime+.04);
      g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+1.4);
      o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+1.5);
      mIdx++;}catch(e){}
    },640);
    bgmNd.push({stop:function(){clearInterval(mId);}});

    // 성스러운 배음 (C5 G5 — 5도 위)
    [[523.2,.009],[784,.007]].forEach(function(p,i){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=p[0];g.gain.value=0;
      o.connect(g);g.connect(dly);o.start();bgmNd.push(o);
      fadeGain(g,0,p[1],2.5+i*.5);
    });

    if(lv>=3){
      // 황금빛 shimmer 고음
      var shId=setInterval(function(){
        if(Math.random()>.4)try{
          var ac2=getAC();var o=ac2.createOscillator(),g=ac2.createGain();
          o.type='sine';o.frequency.value=[1047,1175,1319,1568][Math.floor(Math.random()*4)];
          g.gain.setValueAtTime(0,ac2.currentTime);
          g.gain.linearRampToValueAtTime(.012,ac2.currentTime+.04);
          g.gain.exponentialRampToValueAtTime(.001,ac2.currentTime+1.0);
          o.connect(g);g.connect(dly);o.start();o.stop(ac2.currentTime+1.1);
        }catch(e){}
      },800);
      bgmNd.push({stop:function(){clearInterval(shId);}});
    }
  }
}

function lerp(a,b,t){return a+(b-a)*t;}
function lsk(a,b,t){// 두 스켈레톤 보간
  var o={};
  for(var k in a)o[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t)];
  return o;
}
// 스켈레톤 그리기 (cx,cy=중심, s=scale)
function dsk(sk,cx,cy,s,col,al){
  if(!sk||al<.01)return;
  ctx.save();ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.fillStyle=col;
  ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  function pt(k){return[cx+sk[k][0]*s,cy+sk[k][1]*s];}
  function ln(a,b){var A=pt(a),B=pt(b);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();}
  var h=pt('head');ctx.beginPath();ctx.arc(h[0],h[1],s*.45,0,Math.PI*2);ctx.fill();
  ln('neck','hip');ln('lShoulder','neck');ln('rShoulder','neck');
  ln('lShoulder','lElbow');ln('lElbow','lHand');ln('rShoulder','rElbow');ln('rElbow','rHand');
  ln('hip','lKnee');ln('lKnee','lFoot');ln('hip','rKnee');ln('rKnee','rFoot');
  ctx.restore();
}

// ── 한붓그리기 판정 ─────────────────────────────
function ptSegDist(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,q=dx*dx+dy*dy;
  if(q<.0001)return Math.hypot(px-ax,py-ay);
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/q));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function pathTracedSeg(path,ax,ay,bx,by){
  if(path.length<2)return false;
  var L=Math.hypot(bx-ax,by-ay);
  var R=Math.max(26,Math.min(36,L*.30));
  var RE=Math.max(32,Math.min(46,L*.38));
  // 1단계: 양 끝점 방문 확인 (경로 세그먼트 기반)
  var vA=false,vB=false;
  for(var i=1;i<path.length;i++){
    var x0=path[i-1][0],y0=path[i-1][1],x1=path[i][0],y1=path[i][1];
    if(!vA&&ptSegDist(ax,ay,x0,y0,x1,y1)<RE)vA=true;
    if(!vB&&ptSegDist(bx,by,x0,y0,x1,y1)<RE)vB=true;
    if(vA&&vB)break;
  }
  if(!vA||!vB)return false;
  // 2단계: 선분을 12px 간격 샘플링 → 커버율 체크
  var n=Math.max(4,Math.floor(L/12)),cov=0;
  for(var i=0;i<=n;i++){
    var t=i/n,sx=ax+(bx-ax)*t,sy2=ay+(by-ay)*t;
    for(var j=1;j<path.length;j++){
      if(ptSegDist(sx,sy2,path[j-1][0],path[j-1][1],path[j][0],path[j][1])<R){cov++;break;}
    }
  }
  return cov/(n+1)>=(L<50?.68:L<90?.58:.48);
}

// 발사 가능 범위 계산 (방향+강도 → 도달 가능한 x 범위)
function getLaunchReach(dx,dy,amt){
  if(amt<12)return null;
  var pr=amt/130;
  var pw=(13+pr*10)*(getNext()?getNext().el:1);
  var vY=-(pw+3);
  var apexT=Math.abs(vY)/.42;
  // 수평 속도는 드래그 방향 영향
  var ang=Math.atan2(-dy,dx); // 0=오른쪽
  var hSpeed=(pw+3)*.55*Math.cos(ang); // 방향 기반 수평속도
  var totalTime=apexT*2+8;
  var hRange=hSpeed*totalTime;
  // 출발 x에서 도달 가능 범위
  var fromX=chx+ropeCharOffset*(cz().xR);
  return{cx:fromX,reach:Math.abs(hRange),dir:hRange>0?1:-1,fromX:fromX};
}

// 도달 가능 여부 체크
function canReachRope(r,reach){
  if(!reach)return false;
  var tx=sX(r.xOff);
  var dist=reach.dir>0?(tx-reach.fromX):(reach.fromX-tx);
  return dist>-40&&dist<reach.reach+40;
}

// ── 별자리 세그먼트 체크 ────────────────────────
function checkSegs(){
  if(!CS.active||CS.done)return;
  var c=CONSTS[CS.ci];
  for(var si=0;si<c.segs.length;si++){
    if(CS.drawn.indexOf(si)>=0)continue;
    var i0=c.segs[si][0],i1=c.segs[si][1];
    if(!c.pts[i0]||!c.pts[i1])continue;
    var x1=CS.cx+c.pts[i0][0],y1=CS.cy+c.pts[i0][1];
    var x2=CS.cx+c.pts[i1][0],y2=CS.cy+c.pts[i1][1];
    if(!pathTracedSeg(CS.path,x1,y1,x2,y2))continue;
    CS.drawn.push(si);starSnd(CS.drawn.length-1);
    CS.fx.push({x:(x1+x2)/2,y:(y1+y2)/2,r:6,life:1,col:c.color});
    constComp=CS.drawn.length/c.segs.length;trailCol=c.color;
    if(CS.drawn.length<c.segs.length)continue;
    // 별자리 완성!
    CS.done=true;CS.pose=CONST_POSE[CS.ci%CONST_POSE.length];constComp=1;
    completeSnd(bgmLvl);bgmLvl=Math.min(bgmLvl+1,3);setBGM(bgmLvl);beatP=1;
    if(navigator.vibrate)navigator.vibrate(30);

    // ── 점수 계산 (C안: 기본점 × 난이도 × 콤보 × 발사강도) ──
    var diffBase=[300,500,800][c.diff-1]||300;          // 난이도 기본점
    var diffMult=[1.0,1.5,2.5][c.diff-1]||1.0;         // 난이도 배율
    var comboMult=Math.min(4.0,1+st*.2);                // 콤보 배율 (최대 4×)
    var pullMult=1+((CS.pr||0)*.8);                     // 발사강도 배율 (1.0~1.8×)
    var rawScore=Math.round(diffBase*diffMult*comboMult*pullMult);

    // 보너스 항목 (별도 표시용)
    var bonusItems=[];
    if(st>=2)bonusItems.push(st+'콤보 ×'+comboMult.toFixed(1));
    if((CS.pr||0)>.5)bonusItems.push('강발사 ×'+pullMult.toFixed(1));
    if(c.diff===3)bonusItems.push('희귀 ×2.5');
    else if(c.diff===2)bonusItems.push('보통 ×1.5');

    sc+=rawScore;updateHUD();

    // 콤보 마일스톤 추가 보상
    var milestoneBonus=0;
    if(st>0&&st%3===0){
      milestoneBonus=st*150;
      sc+=milestoneBonus;updateHUD();
    }

    // ── 피드백 표시 ──
    var scoreStr='+'+rawScore.toLocaleString()+'점';
    if(milestoneBonus>0)scoreStr+='  🎯 +'+milestoneBonus;
    var detailStr=bonusItems.length?bonusItems.join(' · '):'BGM Lv.'+bgmLvl;

    // 완성 멘트 (콤보·난이도에 따라 다르게)
    var clearMsgs={
      1:['클리어!','완성!','굿!','성공!','잡았다!'],
      2:['완벽해!','멋진데!','클리어!','대단해!','성공!'],
      3:['완벽 클리어!','환상적이야!','대단해!','레전드!','신들렸다!']
    };

function addTrail(x,y,comp){
  trailPts.push({x:x,y:y,age:0,comp:comp,col:trailCol});
  var rate=comp<.33?.07:comp<.66?.22:.48;
  if(Math.random()<rate)spawnFx(x,y,comp);
}
function spawnFx(x,y,comp){
  var col=trailCol;
  if(comp<.33){
    trailFx.push({t:'dot',x:x,y:y,vx:(Math.random()-.5)*.6,vy:-Math.random()*.5,life:1,ml:30,sz:1.5,col:'rgba(200,200,255,.5)'});
  } else if(comp<.66){
    trailFx.push({t:'star',x:x,y:y,vx:(Math.random()-.5)*1.2,vy:-(Math.random()*.8+.2),life:1,ml:40,sz:3+Math.random()*2,col:col,rot:Math.random()*Math.PI*2});
  } else {
    var cols=[col,'#fff','#ffe97a','#88ffff'];
    trailFx.push({t:'spark',x:x,y:y,vx:(Math.random()-.5)*2.5,vy:-(Math.random()*1.8+.3),life:1,ml:35,sz:2+Math.random()*2.5,col:cols[Math.floor(Math.random()*cols.length)],len:8+Math.random()*12});
    if(Math.random()<.2)trailFx.push({t:'ring',x:x,y:y,vx:0,vy:-.2,life:1,ml:25,sz:4,col:col,exp:0});
  }
}
function burstFx(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=2+Math.random()*4;
    trailFx.push({t:'burst',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,life:1,ml:40+Math.random()*30,sz:2+Math.random()*3,col:col,rot:Math.random()*Math.PI*2});
  }
  if(CS&&CS.active){
    CONSTS[CS.ci].pts.forEach(function(pt){trailFx.push({t:'ghost',x:CS.cx+pt[0],y:CS.cy+pt[1],vx:0,vy:-.3,life:1,ml:60,sz:5,col:col});});
  }
}

// ── Physics ────────────────────────────────────
// FIX: beatP 업데이트를 physics로 이동 (drawBg는 렌더만)
// FIX: 줄 탄성 업데이트 - ft>0인 줄만 처리
function physics(){
  var zi=zoneIdx;
  // 배경 물리 (physics에서만)
  if(zi<=1){CLOUDS.forEach(function(c){c.x-=c.spd*.3;if(c.x+c.w<0)c.x=W+c.w;});}
  if(zi===4){
    mTimer++;
    if(mTimer>14){mTimer=0;meteors.push({x:Math.random()*W,y:-20,vx:(Math.random()-.3)*3,vy:4+Math.random()*3,life:1,len:35+Math.random()*45});}
    for(var i=meteors.length-1;i>=0;i--){var m=meteors[i];m.x+=m.vx;m.y+=m.vy;m.life-=.02;if(m.life<=0)meteors.splice(i,1);}
  }
  beatP*=.87;// FIX: physics로 이동

  // 포즈 블렌드
  if(poseBlendTmr>0){poseBlendTmr--;if(poseBlendT<1)poseBlendT=Math.min(1,poseBlendT+.14);}
  else{poseBlendT=Math.max(0,poseBlendT-.1);if(poseBlendT<=0)poseBlend='stand';}

  // 현재 줄 탄성
  if(curRopeIdx>=0&&curRopeIdx<ropes.length){
    var cr=ropes[curRopeIdx];
    if(Math.abs(cr.ba)>.3||Math.abs(cr.bv)>.3){cr.bv+=(-cr.ba)*.35;cr.bv*=.72;cr.ba+=cr.bv;if(Math.abs(cr.ba)<.25&&Math.abs(cr.bv)<.25){cr.ba=0;cr.bv=0;}}
  }
  // FIX: ft는 착지한 줄만 업데이트 (전체 순회 불필요)
  // → 착지 시 ft=1로 세팅, physics에서 감소
  for(var i=0;i<ropes.length;i++){if(ropes[i].ft>0)ropes[i].ft=Math.max(0,ropes[i].ft-.04);}

  // idle/pulling: 캐릭터 줄 위 위치 업데이트
  if(phase==='idle'||phase==='pulling'){
    camVY=camVY*.8+(swy-camY)*.15;
    camY+=camVY;
    // 줄 위 오프셋 스무스 이동
    ropeCharOffset+=(ropeCharOffsetTarget-ropeCharOffset)*.12;
    // 실제 캐릭터 x를 줄 위 오프셋 반영
    var baseX=sX(curRopeIdx>=0&&curRopeIdx<ropes.length?ropes[curRopeIdx].xOff:0);
    var maxSlide=cz().xR*.75; // 최대 슬라이드 거리
    chx=baseX+ropeCharOffset*maxSlide;
  }
  // 추락 애니메이션
  if(fall){fvy+=1.05;fa=Math.max(0,fa-.016);if(fa<=0){fall=false;fvy=0;fa=1;}return;}
  if(phase!=='flying'&&phase!=='drawing')return;

  // 공중 물리
  airX+=airVX;airY+=airVY;airVY+=.42;airVX*=.996;
  addTrail(airX,airY,constComp);

  var next=getNext();
  if(next){camVY=camVY*.82+(next.worldY-camY)*.035;camY+=camVY;if(camY<next.worldY+5){camY=next.worldY+5;camVY=0;}}
  chvx=chvx*.78+(sX(next?next.xOff:0)-chx)*.07;chx+=chvx;

  // 그리기 타이머
  if(phase==='drawing'&&CS.active){CS.tl--;if(CS.tl<=0)CS.active=false;}

  // 정점 통과 → drawing 모드
  if(phase==='flying'&&airVY>0){
    phase='drawing';
    var c=CONSTS[CS.ci];
    document.getElementById('draw-hint-main').textContent='\u2605 '+c.name;
    document.getElementById('draw-hint-main').style.color=c.color;
    document.getElementById('draw-hint-sub').textContent='\uc120\uc744 \uc774\uc5b4 \ubcc4\uc790\ub9ac\ub97c \uc644\uc131\ud558\uc138\uc694';
    _elDrawHint.style.opacity='1';
    setTimeout(function(){_elDrawHint.style.opacity='0';},1100);
  }

  // 착지 판정 (화면좌표 기반, 하강 중에만)
  if(next&&airVY>0&&airY>=sY(next.worldY)){
    if(next.cleared){phase='idle';resetCS();trailPts=[];camY=swy;camVY=0;return;}
    // ── 착지 ──
    swy=next.worldY;
    camY=swy+20;camVY=-2;chx=sX(next.xOff);chvx=0;
    airY=CDY-CHAR_OFS;airVY=0;airVX=0;
    var idx=ropes.indexOf(next);
    if(idx>=0){ropes[idx].ba=16;ropes[idx].bv=0;ropes[idx].ft=1;}
    // FIX: cleared 조건 - 현재 줄(swy) 포함 아래 모두
    ropes.forEach(function(r){if(r.worldY>=swy)r.cleared=true;});
    pruneRopes();
    // 별자리 결과
    if(CS.done){
      poseBlend=CS.pose;poseBlendT=1;poseBlendTmr=75;tone(1047,.22,.14);st++;
      if(sessionConsts.indexOf(CS.ci)<0)sessionConsts.push(CS.ci);
      codexRecord(CS.ci);
      // 미션 트리거: 별자리 완성
      triggerMission({type:'const_clear',ci:CS.ci,pr:CS.pr||0});
      // 미션 트리거: 콤보
      if(st>0)triggerMission({type:'combo',st:st+1});
    } else if(CS.drawn.length>0){
      var ratio=CS.drawn.length/CONSTS[CS.ci].segs.length;
      var pb=Math.round(ratio*80*(CS.ci+1));
      if(pb>0){sc+=pb;updateHUD();showFB(Math.round(ratio*100)+'% 완성',('아쉬워요 +'+pb+'점  미완성 선: '+(CONSTS[CS.ci].segs.length-CS.drawn.length)+'개'),'rgba(200,200,255,.9)');}
      // 못 그린 선 강조 표시
      CS.missedFlash=60;
      st=Math.max(0,st-1);
    } else {
      CS.missedFlash=80;
      loseDraw('선을 하나도 못 그렸어요');
    }
    updateHUD();
    var _mf=CS.missedFlash||0;
    resetCS();constComp=0;trailPts=[];
    if(_mf>0)CS.missedFlash=_mf;
    // 구간 전환
    zoneP++;var z=cz();
    if(zoneP>=z.ropes&&zoneIdx===6){
      // 달 구간 클리어 = 엔딩!
      showEnding();return;
    }
    if(zoneP>=z.ropes&&zoneIdx<6){
      zoneIdx++;zoneP=0;zoneFade=0;recentConsts=[];zanAnn(zoneIdx);updateZB();
      sc+=500*(zoneIdx+1);updateHUD();
      fsh=22;fsc=hexToRgba(ZONES[zoneIdx].color,.4);
      [523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.45,.1);},i*40);});
      setTimeout(function(){setZoneBGM(zoneIdx);},500);
      triggerMission({type:'zone',zi:zoneIdx}); // 미션: 구간 도달
    }
    triggerMission({type:'land_ok'}); // 미션: 착지 성공
    // 줄 추가 생성
    while(ropes[ropes.length-1].worldY>swy-2200)mkRope();
    phase='idle';
    return;
  }

  // 낙하 실패 판정 (너무 아래로)
  if(airY>CDY+300){
    phase='idle';resetCS();constComp=0;trailPts=[];
    triggerMission({type:'fail'}); // 미션: 실패 (no_miss 리셋)
    loseLife('너무 아래로 떨어졌어요');
    fall=true;fvy=0;fa=1;camY=swy;camVY=0;
    updateCurRopeIdx();
    chx=curRopeIdx>=0?sX(ropes[curRopeIdx].xOff):W/2;chvx=0;
  }
  // 좌우 이탈 실패 판정
  if(airVY>0&&(airX<-80||airX>W+80)){
    var missedRope=getNext();
    phase='idle';resetCS();constComp=0;trailPts=[];
    triggerMission({type:'fail'}); // 미션: 실패
    loseMiss('줄 위치를 벗어났어요');
    if(missedRope)missedRope.missFlash=45;
    camY=swy;camVY=0;
    updateCurRopeIdx();
    chx=curRopeIdx>=0?sX(ropes[curRopeIdx].xOff):W/2;chvx=0;airX=chx;airY=CDY-CHAR_OFS;
  }
}

function doLaunch(){
  var next=getNext();if(!next)return;
  var pr=pullAmt/130,bgmB=bgmLvl>0?1+bgmLvl*.08:1;
  var pw=(13+pr*10)*next.el*bgmB;
  airPose=curDP.pose||'headspin';
  // 발사 위치: 줄 위 현재 캐릭터 위치 (ropeCharOffset 반영)
  airX=chx;airY=CDY-CHAR_OFS;
  // 발사 방향: 드래그 벡터를 직접 사용
  var ang=Math.atan2(-pullDY,pullDX); // 0=오른쪽
  var vMag=pw+3;
  airVY=-vMag*Math.abs(Math.sin(ang+Math.PI/2)); // 위쪽 성분
  airVX=vMag*.55*Math.cos(ang);                   // 수평 성분 (방향 반영)
  // 다음 줄 방향으로 보정 (완전 수직 발사 방지)
  var targetX=sX(next.xOff);
  var apexT=Math.abs(airVY)/.42;
  var neededVX=(targetX-airX)/(apexT*2+8);
  // 사용자 의도(cos성분)와 필요 속도를 블렌딩
  airVX=airVX*.7+neededVX*.3; // 유저 의도 70%, 자동 유도 30%
  if(curRopeIdx>=0&&curRopeIdx<ropes.length){
    // 당기는 방향에 따라 줄 탄성 방향성 부여
    ropes[curRopeIdx].ba=pullAmt*.48*Math.cos(ang);
    ropes[curRopeIdx].bv=-pw*2.2;
  }
  var cii=next.ci||0;constComp=0;trailCol=CONSTS[cii].color;
  var diff=CONSTS[cii].diff||1;
  var diffBonus=diff===1?1.5:diff===2?1.25:1.0;
  var zoneBonus=zoneIdx<=1?1.3:zoneIdx<=3?1.1:1.0;
  var af=Math.max(80,Math.round(apexT*2.9*diffBonus*zoneBonus));
  CS={active:true,ci:cii,cx:80+Math.random()*520,cy:Math.round(H*.54)+Math.random()*Math.round(H*.18),
      drawn:[],path:[],drawing:false,fx:[],tl:af,tt:af,done:false,pose:'stand',ga:0,pr:pr};
  phase='flying';
  // 발사 후 줄 오프셋 리셋
  ropeCharOffset=0;ropeCharOffsetTarget=0;
  tone(880+pr*220,.1,.1);
  setTimeout(function(){tone(1108+pr*180,.12,.07);},80);
}

// ── 렌더 ───────────────────────────────────────
function drawTrail(){
  // 궤적 라인
  for(var i=1;i<trailPts.length;i++){
    var p=trailPts[i-1],q=trailPts[i],f=Math.max(0,1-q.age/60);
    if(f<.01)continue;
    if(q.comp<.33){
      ctx.save();ctx.globalAlpha=f*.35;ctx.strokeStyle='rgba(200,210,255,.8)';ctx.lineWidth=1.2;ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    } else if(q.comp<.66){
      ctx.save();ctx.globalAlpha=f*.55;ctx.strokeStyle=q.col;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore();
    } else {
      ctx.save();ctx.globalAlpha=f*.22;ctx.strokeStyle=q.col;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore();
      ctx.save();ctx.globalAlpha=f*.8;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore();
    }
  }
  // 파티클
  var now=Date.now();
  for(var i=trailFx.length-1;i>=0;i--){
    var p=trailFx[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.04;var t=p.life;p.life-=1/p.ml;
    if(p.life<=0){trailFx.splice(i,1);continue;}
    ctx.save();
    if(p.t==='dot'){ctx.globalAlpha=t*.6;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();}
    else if(p.t==='star'){ctx.globalAlpha=t*.75;ctx.fillStyle=p.col;ctx.translate(p.x,p.y);ctx.rotate(p.rot+now*.002);ctx.beginPath();for(var j=0;j<5;j++){var a=j*(Math.PI*2/5)-Math.PI/2,ia=a+Math.PI/5;j===0?ctx.moveTo(Math.cos(a)*p.sz,Math.sin(a)*p.sz):ctx.lineTo(Math.cos(a)*p.sz,Math.sin(a)*p.sz);ctx.lineTo(Math.cos(ia)*p.sz*.45,Math.sin(ia)*p.sz*.45);}ctx.closePath();ctx.fill();}
    else if(p.t==='spark'){ctx.globalAlpha=t*.8;ctx.strokeStyle=p.col;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*(p.len||10)/p.sz,p.y-p.vy*(p.len||10)/p.sz);ctx.stroke();ctx.globalAlpha=t*.5;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*.5,0,Math.PI*2);ctx.fill();}
    else if(p.t==='ring'){p.exp=(p.exp||0)+1.2;ctx.globalAlpha=t*.35;ctx.strokeStyle=p.col;ctx.lineWidth=.8;ctx.beginPath();ctx.arc(p.x,p.y,p.exp,0,Math.PI*2);ctx.stroke();}
    else{ctx.globalAlpha=t*(p.t==='ghost'?.5:.7);ctx.fillStyle=p.col;ctx.translate(p.x,p.y);if(p.rot)ctx.rotate(p.rot);ctx.beginPath();if(p.t==='burst'){for(var j=0;j<5;j++){var a=j*(Math.PI*2/5)-Math.PI/2,ia=a+Math.PI/5;j===0?ctx.moveTo(Math.cos(a)*p.sz,Math.sin(a)*p.sz):ctx.lineTo(Math.cos(a)*p.sz,Math.sin(a)*p.sz);ctx.lineTo(Math.cos(ia)*p.sz*.4,Math.sin(ia)*p.sz*.4);}ctx.closePath();}else ctx.arc(0,0,p.sz*t,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }
  // 에이징: 앞쪽부터 제거 (push로 추가하므로 앞이 항상 오래됨)
  for(var i=0;i<trailPts.length;i++)trailPts[i].age++;
  var _exp=0;while(_exp<trailPts.length&&trailPts[_exp].age>=65)_exp++;
  if(_exp>0)trailPts.splice(0,_exp);
}

function drawBg(){
  var z=cz(),zi=zoneIdx,now=Date.now(),fz=zoneFade;

  // ── 공통: 배경 그라데이션 ──
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,z.s0);g.addColorStop(1,z.s1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // ── BGM 비트 플래시 ──
  if(beatP>.01){ctx.save();ctx.globalAlpha=beatP*.07;ctx.fillStyle=z.color;ctx.fillRect(0,0,W,H);ctx.restore();}

  // ═══════════════════════════════════════════════
  // ZONE 0 — 도시 야경  (대류권 하층)
  // 특징: 도시 빛공해 오렌지 헤이즈, 구름, 건물 실루엣+창문
  // ═══════════════════════════════════════════════
  if(zi===0){
    // 지평선 빛공해 (오렌지-앰버 헤이즈)
    ctx.save();
    var haze=ctx.createRadialGradient(W/2,H,H*.3,W/2,H,H*.95);
    haze.addColorStop(0,'rgba(255,140,40,.22)');
    haze.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=fz;ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 별 (도시라 희미)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);ctx.fillStyle='rgba(255,255,255,'+Math.min(1,s.br*(.12+tw*.12))+')';ctx.beginPath();ctx.arc(s.x,s.y*.7,s.r*.8,0,Math.PI*2);ctx.fill();});
    // 구름 (빛공해 반사로 아랫면 오렌지)
    CLOUDS.forEach(function(c){
      ctx.save();ctx.globalAlpha=c.a*.9*fz;
      ctx.fillStyle='rgba(30,35,60,1)';
      ctx.beginPath();ctx.arc(c.x,c.y,c.h*.9,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w*.4,c.y-c.h*.2,c.h*.7,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w*.8,c.y,c.h*.55,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=c.a*.4*fz;ctx.fillStyle='rgba(255,130,30,1)';
      ctx.beginPath();ctx.arc(c.x,c.y+c.h*.3,c.h*.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w*.4,c.y,c.h*.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w*.8,c.y+c.h*.25,c.h*.35,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    // 건물 + 창문
    ctx.save();ctx.globalAlpha=fz;ctx.fillStyle='rgba(2,1,14,.98)';
    ctx.beginPath();BLD_SIL.forEach(function(p,i){i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});ctx.closePath();ctx.fill();
    BLD_WIN.forEach(function(p){
      var flicker=Math.sin(now*.0003+p[0]*7.3+p[1]*.05)>.65;
      ctx.fillStyle=flicker?'rgba(255,220,100,.45)':'rgba(255,200,80,.22)';
      ctx.fillRect(p[0],p[1],5,4);
    });
    ctx.restore();
  }

  // ═══════════════════════════════════════════════
  // ZONE 1 — 구름 속  (대류권 상층)
  // 특징: 흰 구름 레이어들이 화면을 가득 채움, 구름 사이로 달빛
  // ═══════════════════════════════════════════════
  if(zi===1){
    // 구름 안 안개 레이어
    ctx.save();ctx.globalAlpha=.18*fz;ctx.fillStyle='rgba(180,210,240,1)';ctx.fillRect(0,0,W,H);ctx.restore();
    // 별 (구름 위로 보일 듯 말 듯)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);ctx.fillStyle='rgba(255,255,255,'+Math.min(1,s.br*(.15+tw*.1))+')';ctx.beginPath();ctx.arc(s.x,s.y*.6,s.r,0,Math.PI*2);ctx.fill();});
    // 큰 구름 덩어리들 (전경)
    CLOUDS.forEach(function(c,i){
      var yOff=i%2===0?0:80;
      var scale=1.8+i*.3;
      ctx.save();ctx.globalAlpha=(.28+c.a*.5)*fz;ctx.fillStyle='rgba(210,228,248,1)';
      ctx.beginPath();ctx.arc(c.x,c.y*1.1+yOff,c.h*scale,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w*.5,c.y*1.1+yOff-c.h*.3,c.h*scale*.8,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(c.x+c.w,c.y*1.1+yOff,c.h*scale*.65,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    // 구름 광선 (햇빛/달빛이 구름 사이로)
    ctx.save();
    for(var i=0;i<4;i++){
      var rx=W*.2+i*W*.18,ralpha=.04+Math.sin(now*.0005+i)*0.02;
      var rg=ctx.createLinearGradient(rx,0,rx+30,H);
      rg.addColorStop(0,'rgba(200,220,255,'+ralpha+')');rg.addColorStop(1,'rgba(200,220,255,0)');
      ctx.fillStyle=rg;ctx.fillRect(rx-15,0,40,H);
    }
    ctx.globalAlpha=fz;ctx.restore();
  }

  // ═══════════════════════════════════════════════
  // ZONE 2 — 오로라  (성층권 하층)
  // 특징: 강렬한 오로라 커튼, 짙은 네이비 하늘, 별 많아짐
  // ═══════════════════════════════════════════════
  if(zi===2){
    // 별 (이제부터 잘 보임)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw)*Math.cos(now*s.sp*.0007+s.tw*.5);ctx.fillStyle='rgba(255,255,255,'+Math.min(1,s.br*(.5+tw*.5))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(0.8+tw*.3),0,Math.PI*2);ctx.fill();});
    // 오로라 커튼 (훨씬 두껍고 화려하게)
    AURORAS.forEach(function(a,i){
      ctx.save();
      var hue=140+i*28;
      // 두꺼운 글로우 레이어
      ctx.globalAlpha=.12*fz;
      ctx.strokeStyle='hsla('+hue+',100%,72%,1)';
      ctx.lineWidth=55+i*18;ctx.beginPath();
      for(var x=0;x<W;x+=4){var y=H*.05+Math.sin(x*.012+a.ph+now*.00085*a.spd)*a.amp*1.8+i*52;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.stroke();
      // 밝은 중심선
      ctx.globalAlpha=.22*fz;
      ctx.strokeStyle='hsla('+hue+',90%,88%,1)';
      ctx.lineWidth=8+i*3;ctx.beginPath();
      for(var x=0;x<W;x+=4){var y=H*.05+Math.sin(x*.012+a.ph+now*.00085*a.spd)*a.amp*1.8+i*52;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.stroke();
      ctx.restore();
    });
    // 아래 지평선 어스름
    ctx.save();
    var hz2=ctx.createLinearGradient(0,H*.7,0,H);
    hz2.addColorStop(0,'rgba(0,40,30,0)');hz2.addColorStop(1,'rgba(0,30,20,.55)');
    ctx.globalAlpha=fz;ctx.fillStyle=hz2;ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // ═══════════════════════════════════════════════
  // ZONE 3 — 별빛 바다  (성층권 상층)
  // 특징: 온통 별, 은하수 띠, 성운 글로우
  // ═══════════════════════════════════════════════
  if(zi===3){
    // 은하수 배경 (대각선 띠)
    ctx.save();
    var mwg=ctx.createLinearGradient(0,H*.1,W,H*.9);
    mwg.addColorStop(0,'rgba(80,60,140,.0)');
    mwg.addColorStop(.35,'rgba(120,100,200,.12)');
    mwg.addColorStop(.5,'rgba(180,160,255,.18)');
    mwg.addColorStop(.65,'rgba(120,100,200,.12)');
    mwg.addColorStop(1,'rgba(80,60,140,.0)');
    ctx.globalAlpha=fz;ctx.fillStyle=mwg;ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 별 (가장 많고 밝게)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);var br=Math.min(1,s.br*(.7+tw*.6));ctx.fillStyle='rgba(255,255,255,'+br+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(1+tw*.5),0,Math.PI*2);ctx.fill();
      // 밝은 별에 십자 반짝임
      if(s.br>.75&&tw>.5){ctx.save();ctx.globalAlpha=br*.35;ctx.strokeStyle='rgba(255,240,200,1)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(s.x-s.r*4,s.y);ctx.lineTo(s.x+s.r*4,s.y);ctx.moveTo(s.x,s.y-s.r*4);ctx.lineTo(s.x,s.y+s.r*4);ctx.stroke();ctx.restore();}
    });
    // 성운 글로우 3개
    [[W*.2,H*.25,'rgba(80,40,160,.14)'],[W*.72,H*.55,'rgba(40,120,180,.12)'],[W*.45,H*.8,'rgba(160,60,120,.1)']].forEach(function(nb){
      ctx.save();var ng=ctx.createRadialGradient(nb[0],nb[1],0,nb[0],nb[1],180);
      ng.addColorStop(0,nb[2]);ng.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=fz;ctx.fillStyle=ng;ctx.fillRect(0,0,W,H);ctx.restore();
    });
  }

  // ═══════════════════════════════════════════════
  // ZONE 4 — 운석우  (중간권)
  // 특징: 붉은 기운, 운석들이 폭포처럼, 연기 잔해
  // ═══════════════════════════════════════════════
  if(zi===4){
    // 운석 진입 열 (붉은/오렌지 틴트)
    ctx.save();
    var heatG=ctx.createLinearGradient(0,0,0,H);
    heatG.addColorStop(0,'rgba(80,20,10,.0)');heatG.addColorStop(.6,'rgba(60,15,5,.18)');heatG.addColorStop(1,'rgba(40,10,0,.35)');
    ctx.globalAlpha=fz;ctx.fillStyle=heatG;ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 별
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);ctx.fillStyle='rgba(255,220,180,'+Math.min(1,s.br*(.5+tw*.4))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    // 운석 (더 많고 강렬하게)
    meteors.forEach(function(m){
      ctx.save();ctx.globalAlpha=m.life*.85*fz;
      // 운석 몸통 (흰→오렌지 그라데이션)
      var mg=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*(m.len/4),m.y-m.vy*(m.len/4));
      mg.addColorStop(0,'rgba(255,255,220,1)');mg.addColorStop(.4,'rgba(255,150,50,.8)');mg.addColorStop(1,'rgba(255,80,0,0)');
      ctx.strokeStyle=mg;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*(m.len/4),m.y-m.vy*(m.len/4));ctx.stroke();
      // 발광 코어
      ctx.globalAlpha=m.life*.7*fz;
      var cg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,5);
      cg.addColorStop(0,'rgba(255,255,200,.9)');cg.addColorStop(1,'rgba(255,100,0,0)');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(m.x,m.y,5,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    // 연기/먼지 파티클 (운석 잔해)
    if(meteors.length>0){
      var m0=meteors[0];if(m0){
        ctx.save();ctx.globalAlpha=m0.life*.07*fz;ctx.fillStyle='rgba(255,100,30,1)';
        ctx.beginPath();ctx.arc(m0.x,m0.y,20+m0.life*30,0,Math.PI*2);ctx.fill();ctx.restore();
      }
    }
  }

  // ═══════════════════════════════════════════════
  // ZONE 5 — 우주 경계  (열권 / 우주)
  // 특징: 완전한 우주 공간, 지구 곡선 희미하게, 보라 성운
  // ═══════════════════════════════════════════════
  if(zi===5){
    // 별 (크고 선명)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);var br=Math.min(1,s.br*(.8+tw*.5));ctx.fillStyle='rgba(255,255,255,'+br+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(1.1+tw*.4),0,Math.PI*2);ctx.fill();
      if(s.br>.6&&tw>.6){ctx.save();ctx.globalAlpha=br*.4;ctx.strokeStyle='rgba(200,180,255,1)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(s.x-s.r*5,s.y);ctx.lineTo(s.x+s.r*5,s.y);ctx.moveTo(s.x,s.y-s.r*5);ctx.lineTo(s.x,s.y+s.r*5);ctx.stroke();ctx.restore();}
    });
    // 지구 대기권 곡선 (화면 아래쪽에 희미하게)
    ctx.save();
    var eR=H*1.4;
    var earthG=ctx.createRadialGradient(W/2,H+eR*.62,eR*.55,W/2,H+eR*.62,eR);
    earthG.addColorStop(0,'rgba(30,80,200,.0)');
    earthG.addColorStop(.85,'rgba(20,60,180,.22)');
    earthG.addColorStop(.93,'rgba(100,180,255,.35)');
    earthG.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=fz;ctx.fillStyle=earthG;ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 보라빛 성운 레이어 (zone5 특색)
    ctx.save();
    var pvg=ctx.createLinearGradient(0,0,W,H);
    pvg.addColorStop(0,'rgba(60,0,120,.0)');pvg.addColorStop(.4,'rgba(80,0,180,.10)');pvg.addColorStop(.6,'rgba(100,20,200,.12)');pvg.addColorStop(1,'rgba(40,0,80,.0)');
    ctx.globalAlpha=fz;ctx.fillStyle=pvg;ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 우주 정거장 느낌 - 멀리서 지나가는 빛점
    var dotT=(now*.00012)%1;var dotX=dotT*W,dotY=H*.15+dotT*H*.1;
    ctx.save();ctx.globalAlpha=.45*fz;ctx.fillStyle='rgba(200,220,255,1)';ctx.beginPath();ctx.arc(dotX,dotY,1.8,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // ═══════════════════════════════════════════════
  // ZONE 6 — 달  
  // 특징: 달 표면이 배경, 금빛 분위기, 별 최대
  // ═══════════════════════════════════════════════
  if(zi===6){
    // 별 (최대 밝기)
    STARS.forEach(function(s){var tw=Math.sin(now*s.sp*.001+s.tw);var br=Math.min(1,s.br*(.9+tw*.6));ctx.fillStyle='rgba(255,255,240,'+br+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*(1.2+tw*.5),0,Math.PI*2);ctx.fill();
      if(s.br>.5){ctx.save();ctx.globalAlpha=br*.5;ctx.strokeStyle='rgba(255,240,160,.8)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(s.x-s.r*5,s.y);ctx.lineTo(s.x+s.r*5,s.y);ctx.moveTo(s.x,s.y-s.r*5);ctx.lineTo(s.x,s.y+s.r*5);ctx.stroke();ctx.restore();}
    });
    // 달 배경 - 지평선 가까이 황금빛 달 글로우
    var mBgG=ctx.createRadialGradient(W*.42,H*.3,0,W*.42,H*.3,H*.7);
    mBgG.addColorStop(0,'rgba(255,230,100,.12)');mBgG.addColorStop(.5,'rgba(180,140,40,.06)');mBgG.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();ctx.globalAlpha=fz;ctx.fillStyle=mBgG;ctx.fillRect(0,0,W,H);ctx.restore();
    // 달 지형 - 분화구 실루엣 (바닥)
    ctx.save();ctx.globalAlpha=.18*fz;ctx.fillStyle='rgba(200,180,80,1)';
    [[W*.1,H*.88,80],[W*.35,H*.92,55],[W*.6,H*.86,95],[W*.85,H*.9,65]].forEach(function(cr){
      ctx.beginPath();ctx.arc(cr[0],cr[1],cr[2],Math.PI,Math.PI*2);ctx.fill();
      // 분화구 테두리
      ctx.globalAlpha=.08*fz;ctx.strokeStyle='rgba(255,220,120,1)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cr[0],cr[1]-cr[2]*.1,cr[2]*.9,Math.PI,Math.PI*2);ctx.stroke();
    });
    ctx.restore();
    // 지면 (달 표면)
    ctx.save();ctx.globalAlpha=.45*fz;ctx.fillStyle='rgba(160,140,60,.8)';
    ctx.fillRect(0,H*.93,W,H*.07);ctx.restore();
  }

  // ═══════════════════════════════════════════════
  // 달 오브젝트 (zone 3+ 에서 보이기 시작)
  // ═══════════════════════════════════════════════
  if(zi>=3){
    var msy=sY(-2200);
    if(msy>-130&&msy<H+80){
      var pg=Math.max(0,Math.min(1,(CDY-msy)/CDY)),mr=20+pg*52;
      ctx.save();ctx.globalAlpha=.06*fz;ctx.fillStyle='rgba(255,238,155,1)';
      for(var i=0;i<3;i++){ctx.beginPath();ctx.arc(W*.38,msy,mr*(1.6+i*.9),0,Math.PI*2);ctx.fill();}
      ctx.restore();ctx.fillStyle='#fef0c0';ctx.beginPath();ctx.arc(W*.38,msy,mr,0,Math.PI*2);ctx.fill();
      ctx.save();ctx.globalAlpha=.12;ctx.fillStyle='#b08838';
      [[-0.28,-0.22,.2],[.22,.28,.13],[.35,-.38,.09]].forEach(function(v){ctx.beginPath();ctx.arc(W*.38+v[0]*mr,msy+v[1]*mr,v[2]*mr,0,Math.PI*2);ctx.fill();});
      ctx.restore();ctx.fillStyle=z.s0;ctx.beginPath();ctx.arc(W*.38+mr*.28,msy-mr*.06,mr*.84,0,Math.PI*2);ctx.fill();
      if(pg>.2){ctx.save();ctx.globalAlpha=Math.min(.85,pg*1.5)*fz;ctx.fillStyle='rgba(255,238,155,.9)';ctx.font=Math.round(9+pg*5)+'px sans-serif';ctx.textAlign='center';ctx.fillText('달까지 '+Math.round((1-pg)*100)+'%',W*.38,msy+mr+18);ctx.restore();}
    }
  } else {
    // zone 0~2 에서는 달이 안보임 (배경 처리)
    var msy=sY(-2200);
    if(msy>-130&&msy<H+80){
      var mr=20+70*.5;
      ctx.fillStyle=z.s0;ctx.beginPath();ctx.arc(W*.38,msy,mr+10,0,Math.PI*2);ctx.fill();
    }
  }

  // 구간 페이드인 (천천히 - 0.008 = ~125프레임 = 약2초)
  if(zoneFade<1)zoneFade=Math.min(1,zoneFade+.008);
}

function drawRopes(){
  var next=getNext(),zc=cz().color;
  var hc=parseInt(zc.slice(1),16),hr=(hc>>16)&255,hg=(hc>>8)&255,hb=hc&255;
  for(var ri=ropes.length-1;ri>=0;ri--){
    var r=ropes[ri],sy=sY(r.worldY);
    if(sy<-70||sy>H+20)continue;
    var cx2=sX(r.xOff),L=cx2-200,R2=cx2+200;
    var isCur=(r.worldY===swy),isNext=(phase==='idle'&&r===next);
    var es=Math.min(1,(r.el-.3)/.7);
    // missFlash: 놓친 줄 빨간 점멸
    var isMissed=(r.missFlash||0)>0;
    var al=r.cleared?.07:isCur?.9:.3+es*.25;
    var lw=r.cleared?.9:isCur?3.5:1.5+es*.8;
    ctx.save();
    if(isMissed){
      var mf=r.missFlash/45;
      ctx.strokeStyle='rgba(255,60,40,'+(.5+mf*.5)+')';
      ctx.lineWidth=3+mf*2;
      ctx.shadowColor='rgba(255,60,40,.8)';ctx.shadowBlur=12*mf;
    } else if(r.cleared){ctx.strokeStyle='rgba(255,215,75,'+al+')';}
    else if(isCur){ctx.strokeStyle='rgba('+hr+','+hg+','+hb+','+al+')';}
    else{ctx.strokeStyle='rgba('+Math.round(lerp(100,hr,es))+','+Math.round(lerp(160,hg,es))+','+Math.round(lerp(255,hb,es))+','+al+')';}
    if(!isMissed)ctx.lineWidth=lw;
    ctx.beginPath();ctx.moveTo(L,sy);ctx.quadraticCurveTo(cx2,sy+r.ba,R2,sy);ctx.stroke();
    ctx.shadowBlur=0;
    if(!r.cleared){ctx.fillStyle='rgba(148,108,44,.5)';ctx.fillRect(L-2,sy-4,10,8);ctx.fillRect(R2-8,sy-4,10,8);}
    ctx.restore();
    // missFlash 감소
    if(r.missFlash>0)r.missFlash--;
    // 다음 줄 미리보기
    if(isNext&&!r.cleared){
      var dist=Math.abs(sy-CDY),near=Math.max(0,1-dist/320);
      var cc=CONSTS[r.ci||0];if(!cc)continue;
      ctx.save();ctx.globalAlpha=near*.9;ctx.fillStyle=cc.color;
      ctx.font=Math.round(11+near*3)+'px sans-serif';ctx.textAlign='left';
      ctx.fillText('★ '+cc.name,cx2+42,sy-14);
      ctx.fillStyle=cc.diff===3?'rgba(255,140,100,.8)':cc.diff===2?'rgba(255,200,80,.8)':'rgba(150,220,150,.8)';
      ctx.font='9px sans-serif';ctx.fillText(cc.diff===1?'●':cc.diff===2?'●●':'●●●',cx2+42,sy-2);
      if(near>.35){
        var ms=.28,mx=cx2-230,my=sy-12;ctx.globalAlpha=near*.4;ctx.strokeStyle=cc.color;ctx.lineWidth=1;
        cc.segs.forEach(function(seg){if(!cc.pts[seg[0]]||!cc.pts[seg[1]])return;ctx.beginPath();ctx.moveTo(mx+cc.pts[seg[0]][0]*ms,my+cc.pts[seg[0]][1]*ms);ctx.lineTo(mx+cc.pts[seg[1]][0]*ms,my+cc.pts[seg[1]][1]*ms);ctx.stroke();});
        cc.pts.forEach(function(pt){if(!pt)return;ctx.fillStyle=cc.color;ctx.beginPath();ctx.arc(mx+pt[0]*ms,my+pt[1]*ms,2.2,0,Math.PI*2);ctx.fill();});
      }
      ctx.restore();
    }
    // 착지 파티클
    if(r.ft>0){
      ctx.save();
      for(var j=0;j<8;j++){var a=(j/8)*Math.PI*2+r.ft*4,br=14+(1-r.ft)*40;ctx.globalAlpha=r.ft*.5;ctx.fillStyle=zc;ctx.beginPath();ctx.arc(cx2+Math.cos(a)*br,sy+Math.sin(a)*br,2.5,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
  }
}

function drawChar(){
  var zc=cz().color;
  if(fall){
    dsk({head:[.3,-2.2],neck:[.1,-1.4],lShoulder:[-1.2,-.3],rShoulder:[.5,-.8],lElbow:[-1.8,.8],rElbow:[1.,.2],lHand:[-1.5,1.8],rHand:[1.6,.8],hip:[.2,.5],lKnee:[-.8,1.8],rKnee:[.7,1.2],lFoot:[-1.5,2.8],rFoot:[1.2,2.]},
        chx,CDY+fvy*7-18,11,'#ffe97a',fa);
    return;
  }
  if(phase==='flying'||phase==='drawing'){
    var pose=CS.done?CS.pose:airPose;
    ctx.save();ctx.globalAlpha=.1;ctx.fillStyle=CS.done&&CONSTS[CS.ci]?CONSTS[CS.ci].color:zc;ctx.beginPath();ctx.arc(airX,airY,22,0,Math.PI*2);ctx.fill();ctx.restore();
    dsk(SK[pose]||SK.headspin,airX,airY,12,'#ffe97a',1);
    return;
  }
  // 서있는 포즈 블렌드
  var pp=(phase==='pulling'&&pullAmt>20)?curDP.pose:'stand';
  var bt=(phase==='pulling')?Math.min(1,(pullAmt-20)/60):0;
  var curSk=poseBlendT>.05?lsk(SK.stand,SK[poseBlend]||SK.stand,Math.min(1,poseBlendT)):(bt>.05?lsk(SK.stand,SK[pp]||SK.stand,bt):SK.stand);
  var cg=Math.min(1,bgmLvl/3);
  // BGM 글로우
  if(cg>.01){ctx.save();ctx.globalAlpha=.07+cg*.12;ctx.fillStyle=zc;ctx.beginPath();ctx.arc(chx,CDY,20+cg*10,0,Math.PI*2);ctx.fill();ctx.restore();}
  // 캐릭터 (발이 CDY에 닿도록 중심을 CDY-CHAR_OFS에)
  dsk(curSk,chx,CDY-CHAR_OFS,12,'#ffe97a',1);
  // 당기기 UI
  if(pullAmt>15&&phase==='pulling'){
    ctx.save();ctx.strokeStyle='rgba(255,200,80,.22)';ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(chx,CDY+pullAmt*.5-20);ctx.lineTo(chx,CDY);ctx.stroke();ctx.setLineDash([]);
    if(pullAmt>25){
      var len=Math.min(pullAmt*.42,44),nm=Math.sqrt(pullDX*pullDX+pullDY*pullDY)||1;
      ctx.strokeStyle='rgba(255,180,60,.65)';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(chx,CDY-CHAR_OFS);ctx.lineTo(chx+pullDX/nm*len,CDY-CHAR_OFS+pullDY/nm*len);ctx.stroke();
      ctx.fillStyle='rgba(255,180,60,.65)';ctx.beginPath();ctx.arc(chx+pullDX/nm*len,CDY-CHAR_OFS+pullDY/nm*len,4,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    // 목표 줄 예상 궤적
    var nxt=getNext();
    if(nxt){
      var tx=sX(nxt.xOff),ty=sY(nxt.worldY);
      ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='rgba(255,200,80,.6)';ctx.lineWidth=1;ctx.setLineDash([4,8]);
      ctx.beginPath();ctx.moveTo(chx,CDY);ctx.quadraticCurveTo((chx+tx)/2,CDY-80,tx,ty);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }
  }
}

function drawArrow(){
  if(phase!=='idle'&&phase!=='pulling')return;
  var now=Date.now();
  var next=getNext();
  var reach=phase==='pulling'?getLaunchReach(pullDX,pullDY,pullAmt):null;
  ctx.save();

  if(next){
    var tx=sX(next.xOff),ty=sY(next.worldY);
    var pulse=.5+.35*Math.sin(now/400);
    var canReach=reach?canReachRope(next,reach):true;
    var lineCol=canReach?cz().color:'rgba(255,80,60,1)';

    if(phase==='pulling'&&pullAmt>15){
      // 발사 방향 궤적 예측 (포물선 점선)
      var pr=pullAmt/130;
      var pw=(13+pr*10)*(next.el||1);
      var ang=Math.atan2(-pullDY,pullDX);
      var vx0=pw*.55*Math.cos(ang);
      var vy0=-pw*Math.abs(Math.sin(ang+Math.PI/2));
      var apexT0=Math.abs(vy0)/.42;
      var neededVX=(tx-chx)/(apexT0*2+8);
      vx0=vx0*.5+neededVX*.5;
      var px=chx,py=CDY-CHAR_OFS,pvx=vx0,pvy=vy0;
      for(var i=0;i<24;i++){
        px+=pvx;py+=pvy;pvy+=.42;pvx*=.996;
        ctx.globalAlpha=Math.max(0,.65-i*.027);
        ctx.fillStyle=lineCol;
        var dotR=Math.max(.5,3.5-i*.1);
        ctx.beginPath();ctx.arc(px,py,dotR,0,Math.PI*2);ctx.fill();
        if(py>CDY+50)break;
      }
      // 착지 예상 동그라미
      ctx.globalAlpha=canReach?.75:.55;
      ctx.strokeStyle=lineCol;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(tx,ty,10+pulse*3,0,Math.PI*2);ctx.stroke();
      if(!canReach){
        ctx.globalAlpha=.65;ctx.strokeStyle='rgba(255,80,60,1)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(tx-7,ty-7);ctx.lineTo(tx+7,ty+7);ctx.moveTo(tx+7,ty-7);ctx.lineTo(tx-7,ty+7);ctx.stroke();
      }
    } else {
      // idle: 점선 가이드
      ctx.globalAlpha=pulse*.3;ctx.strokeStyle=cz().color;ctx.lineWidth=1;ctx.setLineDash([5,10]);
      ctx.beginPath();ctx.moveTo(chx,CDY-CHAR_OFS);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
      ctx.globalAlpha=pulse*.45;ctx.strokeStyle=cz().color;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(tx,ty,7,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=pulse*.4;ctx.fillStyle=cz().color;ctx.font='9px sans-serif';ctx.textAlign='center';
      ctx.fillText(CONSTS[next.ci||0].name,tx,ty-14);
    }
  }

  // 줄 위 슬라이드 범위 표시 (당기는 중)
  if(phase==='pulling'&&pullAmt>15&&curRopeIdx>=0&&curRopeIdx<ropes.length){
    var baseX=sX(ropes[curRopeIdx].xOff);
    var maxSlide=cz().xR*.75;
    ctx.globalAlpha=.28+.12*Math.sin(now/220);
    ctx.strokeStyle='rgba(255,220,80,.7)';ctx.lineWidth=1.2;ctx.setLineDash([3,8]);
    ctx.beginPath();ctx.moveTo(baseX-maxSlide,CDY);ctx.lineTo(baseX+maxSlide,CDY);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=.7;ctx.fillStyle='rgba(255,220,80,1)';
    ctx.beginPath();ctx.arc(chx,CDY-2,4,0,Math.PI*2);ctx.fill();
  }

  // idle 화살표
  if(phase==='idle'){
    var bob=Math.sin(now/340)*3,ay2=CDY+18+bob;
    ctx.globalAlpha=.32+.12*Math.sin(now/380);ctx.strokeStyle='rgba(255,206,72,.9)';ctx.lineWidth=1.5;
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(chx,ay2);ctx.lineTo(chx,ay2+14);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(chx-5,ay2+9);ctx.lineTo(chx,ay2+18);ctx.lineTo(chx+5,ay2+9);ctx.stroke();
  }
  ctx.restore();
}

function drawConstOverlay(){
  if(!CS.active)return;
  var c=CONSTS[CS.ci],now=Date.now(),tp=Math.max(0,CS.tl/CS.tt);
  ctx.save();ctx.globalAlpha=.15;ctx.fillStyle='rgba(0,0,20,1)';ctx.fillRect(0,0,W,Math.round(H*.5));ctx.restore();ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='rgba(0,0,20,1)';ctx.fillRect(0,Math.round(H*.5),W,H);ctx.restore();
  if(CS.done){CS.ga=Math.min(1,CS.ga+.07);ctx.save();ctx.globalAlpha=CS.ga*.18;ctx.fillStyle=c.color;ctx.fillRect(0,0,W,H);ctx.restore();}
  // 타이머 바
  var bw=200,bx2=W/2-100;
  ctx.save();ctx.globalAlpha=.55;ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.rect(bx2,14,bw,5);ctx.fill();
  ctx.fillStyle=tp>.35?c.color:'rgba(255,70,50,1)';ctx.beginPath();ctx.rect(bx2,14,bw*tp,5);ctx.fill();ctx.restore();
  // 이름·난이도
  ctx.save();ctx.globalAlpha=.9;ctx.fillStyle=c.color;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('\u2605 '+c.name,W/2,36);
  ctx.globalAlpha=.45;ctx.fillStyle=c.diff===3?'rgba(255,140,100,1)':c.diff===2?'rgba(255,200,80,1)':'rgba(150,220,150,1)';ctx.font='9px sans-serif';ctx.fillText(c.diff===1?'\u25cf \uc27d\uc74c':c.diff===2?'\u25cf\u25cf \ubcf4\ud1b5':'\u25cf\u25cf\u25cf \uc5b4\ub824\uc6c0',W/2,50);ctx.restore();
  if(CS.drawn.length>0&&!CS.done){ctx.save();ctx.globalAlpha=.7;ctx.fillStyle=c.color;ctx.font='bold '+(10+Math.floor(constComp*10))+'px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(constComp*100)+'%',W/2,64);ctx.restore();}
  // 세그먼트
  c.segs.forEach(function(seg,si){
    var i0=seg[0],i1=seg[1];if(!c.pts[i0]||!c.pts[i1])return;
    var x1=CS.cx+c.pts[i0][0],y1=CS.cy+c.pts[i0][1],x2=CS.cx+c.pts[i1][0],y2=CS.cy+c.pts[i1][1];
    var done=CS.drawn.indexOf(si)>=0;
    var missed=CS.missedFlash>0&&!done;
    ctx.save();
    if(missed){
      // 못 그린 선 빨간 점멸 강조
      var fl=Math.sin(CS.missedFlash*.25)*.5+.5;
      ctx.globalAlpha=fl*.7;ctx.strokeStyle='rgba(255,80,60,1)';ctx.lineWidth=2.2;
    } else {
      ctx.globalAlpha=done?.9:.22;ctx.strokeStyle=c.color;ctx.lineWidth=done?2.5:1.2;
    }
    if(!done&&!missed)ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  });
  if(CS.missedFlash>0)CS.missedFlash--;
  // 점
  c.pts.forEach(function(pt,i){
    if(!pt)return;var sx=CS.cx+pt[0],sy2=CS.cy+pt[1];
    var lit=CS.drawn.some(function(si){return c.segs[si]&&(c.segs[si][0]===i||c.segs[si][1]===i);});
    ctx.save();
    if(lit){ctx.globalAlpha=.9;ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(sx,sy2,9,0,Math.PI*2);ctx.fill();}
    else{ctx.globalAlpha=(.55+Math.sin(now*.009+i*.8)*.45)*.75;ctx.fillStyle='rgba(255,255,255,1)';ctx.beginPath();ctx.arc(sx,sy2,6,0,Math.PI*2);ctx.fill();}
    ctx.globalAlpha=lit?.55:.35;ctx.fillStyle=lit?'rgba(0,0,0,.6)':'rgba(255,255,255,.9)';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText(i+1,sx,sy2+3.5);ctx.restore();
  });
  // 유저 경로
  if(CS.path.length>1){
    ctx.save();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=.65;
    ctx.beginPath();ctx.moveTo(CS.path[0][0],CS.path[0][1]);CS.path.forEach(function(p){ctx.lineTo(p[0],p[1]);});ctx.stroke();ctx.restore();
    var last=CS.path[CS.path.length-1];ctx.save();ctx.globalAlpha=.85;ctx.fillStyle='rgba(255,255,255,1)';ctx.beginPath();ctx.arc(last[0],last[1],4.5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  // 완성 이펙트
  for(var i=CS.fx.length-1;i>=0;i--){
    var e=CS.fx[i];ctx.save();ctx.globalAlpha=e.life*.75;ctx.strokeStyle=e.col;ctx.lineWidth=2;var r=e.r+(1-e.life)*26;ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=e.life*.28;ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,r*.4,0,Math.PI*2);ctx.fill();ctx.restore();e.life-=.05;if(e.life<=0)CS.fx.splice(i,1);
  }
  if(CS.done){ctx.save();ctx.globalAlpha=CS.ga*.92;ctx.fillStyle=c.color;ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText('\u2746 '+c.name+' \uc644\uc131!',W/2,H/2-16);ctx.restore();}
}
